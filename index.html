perties / return types by failures","pf":6.5,"mf":2.0,"result":"PHPStan/tests","desc":"Do not type everything. Only what PHP 8.2 / PHPStan fails on after the upgrade."},{"title":"Doctrine ORM stays on 2.x while possible","pf":5.5,"mf":2.0,"result":"do not jump to 3 without cause","desc":"Do not jump to ORM 3 in the same release as 6.4 if 2.x still holds. Reduces schema and hydration risk."},{"title":"Removal of get() and the old EventDispatcher","pf":6.5,"mf":2.0,"result":"deprecated","desc":"Remove Container::get and the deprecated dispatcher in places that fail on 6.4. Do not refactor all 125 files."},{"title":"Soak","pf":6.5,"mf":2.0,"result":"release","desc":"Soak on dev, checklist of payment/login/cron jobs, then production 6.4."}]},{"id":"08.05","title":"Symfony 6.4 → 7.4 LTS","pkg":"III","why":"The target version. 8.1 is not adopted.","done":"PHP 8.3, SF 7.4, PHPStan 2, payment sandbox, extended soak.","deps":"08.04","role":"Senior","pfH":35.5,"mfH":12.0,"subtasks":[{"title":"PHP 8.3","pf":3.0,"mf":1.0,"result":"infrastructure","desc":"PHP 8.3 on dev/prod for 7.4 LTS. Check of extensions as in 08.01."},{"title":"Rector SYMFONY_70…74","pf":8.5,"mf":3.0,"result":"branch upgrade/sf74","desc":"Stepwise Rector 7.0–7.4 sets in the upgrade/sf74 branch. One major diff, without shop features."},{"title":"Remove remnants of old bundles","pf":5.5,"mf":2.0,"result":"composer","desc":"Clean out packages that do not install on 7.4 and must be closed in 08.06. composer.json without defunct packages."},{"title":"PHPStan 2 + raise the level","pf":5.5,"mf":2.0,"result":"CI","desc":"After PHP 8.3 — PHPStan 2 and a new level in CI. Do not carry the old 1.x baseline blindly."},{"title":"Suite + payment sandbox","pf":6.5,"mf":2.0,"result":"manual checklist","desc":"Full suite and a manual sandbox payment of each live PSP on dev. Blocker for production 7.4."},{"title":"Extended soak","pf":6.5,"mf":2.0,"result":"LTS release","desc":"The first modern LTS: soak longer than usual, 24-hour monitoring not above the error baseline."}]},{"id":"08.06","title":"Replacement of unmaintained bundles","pkg":"III","why":"May surface inside 08.02–08.04. The principal unknown is JMS i18n (10 domains).","done":"Assetic, CKEditor, MobileDetect, Excel, sitemap, Guzzle6 closed. JMS i18n either a fork or own routing (then +15–25 days on the platform beyond the plan).","deps":"in parallel with 08.02–08.05","role":"Senior","pfH":57.5,"mfH":23.0,"subtasks":[{"title":"Remove Assetic","pf":6.5,"mf":2.0,"result":"static assets","desc":"If not closed in 08.03 — fully remove assetic-bundle, update {% javascripts %} templates."},{"title":"jms/i18n-routing — fork or own routing","pf":17.0,"mf":6.5,"result":"10 domains stay alive","desc":"10 language domains. If the bundle does not install on SF6/7 — a fork or our own router. The principal schedule unknown; reserve +15–25 days if we write our own."},{"title":"CKEditor bundle replacement","pf":4.5,"mf":2.0,"result":"admin editor","desc":"egeloen/ckeditor is unmaintained. Replace with a supported bundle or CDN. Admin textareas with HTML must not break."},{"title":"MobileDetect subscriber","pf":4.5,"mf":2.0,"result":"mobile templates","desc":"Replace suncat/mobile-detect with our own kernel subscriber. Mobile Twig must be selected as today."},{"title":"ExcelBundle → PhpSpreadsheet","pf":4.5,"mf":2.0,"result":"exports","desc":"liuggio/excelbundle → PhpSpreadsheet. Run admin exports (orders, prices) on a fixture."},{"title":"Update presta/sitemap","pf":3.0,"mf":1.0,"result":"sitemap","desc":"presta/sitemap 1.6 is not for SF7. Update the bundle; sitemap.xml 200 on all sampled locales."},{"title":"Payum + custom gateways under SF7","pf":13.0,"mf":5.5,"result":"payment","desc":"Payum and our Stripe/Hipay/TrueLayer/AirWallex/Klarna/Payop must work on SF7. Notify regression from 03.03 and 06.06 is a mandatory run."},{"title":"Guzzle6 adapter","pf":4.5,"mf":2.0,"result":"HTTP client","desc":"Replace php-http/guzzle6-adapter with a PSR-18/Guzzle 7 compatible layer. PSP and Google Ads clients must not fall over."}]},{"id":"08.07","title":"Release checklist and hypercare","pkg":"III","why":"Each major — payment, login, admin, cron jobs, search.","done":"Checklist per major. Sentry/Rollbar. Rollback rehearsal. Hypercare 5–10 calendar days after production — separate from 8/6 days of net work.","deps":"each major 08.02–08.05","role":"Lead + PM","pfH":38.0,"mfH":14.5,"subtasks":[{"title":"Major-release checklist","pf":5.5,"mf":2.0,"result":"payment, login, admin, cron jobs, search","desc":"One checklist per major: sandbox payment, login, admin product save, stock cron jobs, search. Without a tick — no master deployment."},{"title":"Error monitoring (Sentry / Rollbar)","pf":5.5,"mf":2.0,"result":"alerts","desc":"On PF, Rollbar is currently commented out; on MF, Sentry exists. Enable a working tracker on both, alerts on a post-release spike."},{"title":"Hypercare after production (work, not waiting)","pf":21.5,"mf":8.5,"result":"bugfixes","desc":"5–10 calendar days after a major: fix defects, do not plan features. The estimate is working hours on bugfixes, not idle waiting."},{"title":"Rollback rehearsal on staging","pf":5.5,"mf":2.0,"result":"run-through","desc":"Run a rollback once: previous tag + database backup. If it is not rehearsed, a production incident will exceed the rollback SLA."}]}]}], ru: [{"id":"01","title":"Аудит (параллельно с этапом 02)","goal":"Зафиксировать архитектуру, риски и пробелы покрытия без изменений продакшена. Выполняется параллельно с этапом 02 и не является условием внедрения PHPUnit. Промежуточные результаты уточняют приоритет сценариев этапа 03.","pfD":6.5,"mfD":2.5,"color":"gray","tasks":[{"id":"01.01","title":"Карта архитектуры","pkg":"I","why":"Карта модулей, интеграций и контуров, без которой аудит и тесты ведутся без системной основы.","done":"Документ, по которому новый разработчик понимает, где каталог, корзина, оплата, админка и кроны.","deps":"Нет. Начинается одновременно с 02.01.","role":"Senior Symfony","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Инвентаризация бандлов, сервисов, роутов, команд","pf":2.0,"mf":0.5,"result":"таблица бандл → ответственность","desc":"Пройти src/*Bundle, services.yml, routing и bin/console list. Для каждого бандла зафиксировать ответственность, контроллеры и команды, внешние зависимости. Результат — вход в аудит и в приоритет тестов."},{"title":"Карта внешних систем (платежи, поиск, Mailchimp, Ads, PF↔MF)","pf":1.5,"mf":0.5,"result":"схема интеграций","desc":"Собрать все исходящие HTTP/SOAP/SDK: PSP, Typesense/Algolia, Mailchimp, Google Ads, Make.com, соседняя витрина. Для каждой — окружения, секреты, что будет, если сервис лежит."},{"title":"Модель Product / Purchase / User / Variation","pf":1.5,"mf":0.5,"result":"упрощённый ER","desc":"Нарисовать упрощённый ER ключевых сущностей и связей (видимость, slug, цены, адреса заказа). Понять, где правки каталога бьют корзину и оплату."},{"title":"Среды и деплой (Docker, Pipelines, cache/logs)","pf":0.5,"mf":0.5,"result":"описание контуров","desc":"Описать local/dev/staging/prod: Docker, rsync Pipelines, куда пишутся cache и logs (у PF они вне репо). Зафиксировать, как выкладываем и как откатываем."}]},{"id":"01.02","title":"Хрупкие зоны и связность","pkg":"I","why":"Объяснить, почему правка в одном месте ломает другое.","done":"Топ-20 файлов риска и карта «изменение X → риск Y» для каталога, цен, корзины, статусов.","deps":"01.01","role":"Senior Symfony","pfH":8.5,"mfH":2.5,"subtasks":[{"title":"Список god-классов (>1k строк)","pf":1.5,"mf":0.5,"result":"ProductController, CartController, cron-команды","desc":"Найти контроллеры и команды больше ~1000 строк. Это места, где «маленькая правка» ломает соседний сценарий. В топе уже ProductController, CartController, AddData*StaticPage, AppConstants."},{"title":"Скрытые зависимости: статика, AppConstants, контейнер","pf":2.0,"mf":0.5,"result":"список связей","desc":"Найти AppConstants, статические вызовы и $this->get()/container в контроллерах. Составить, какие модули связаны не через явный сервис, а через глобальное состояние."},{"title":"Пересечения PF ↔ MF (сток, картинки, API consumer)","pf":1.5,"mf":0.5,"result":"карта интеграций","desc":"Описать кроны и URL, которыми витрины дергают друг друга (stock-by-sku, картинки, ApiConsumer). Правка на одной стороне может оставить мусор на другой."},{"title":"Карта правка X → риск Y","pf":2.0,"mf":0.5,"result":"для каталога/цен/корзины/заказов","desc":"Таблица: изменили цену/видимость/статус заказа/промокод → какие страницы, письма и кроны могут сломаться. Это вход в приоритет тестов этапа 03."},{"title":"Дубли бизнес-правил (Twig + PHP + JS + cron)","pf":1.5,"mf":0.5,"result":"список дублей","desc":"Найти одно и то же правило (доступность товара, скидка, VAT), повторённое в шаблоне, контроллере, JS и кроне. Такие дубли — типичный источник регрессий."}]},{"id":"01.03","title":"Зависимости и технический долг","pkg":"I","why":"Понять, что блокирует апгрейд и какие CVE уже есть.","done":"Таблица пакетов: версия, последняя, блокер Symfony 4–7, CVE.","deps":"01.01","role":"Senior Symfony","pfH":5.5,"mfH":2.5,"subtasks":[{"title":"composer outdated + composer audit","pf":1.0,"mf":0.5,"result":"список CVE","desc":"Снять composer outdated и composer audit. Таблица: пакет, текущая версия, последняя, CVE, можно ли обновить на PHP 7.4 / Symfony 3.4."},{"title":"Бандлы без апстрима (FOSUser, Assetic, Swiftmailer, JMS i18n)","pf":1.5,"mf":0.5,"result":"блокеры апгрейда","desc":"По каждому мёртвому бандлу: чем заменяем, на каком шаге Symfony это блокер, можно ли жить до 5.4. FOSUser и JMS i18n — главные риски срока."},{"title":"JS-долг: Inspinia, uglify, нет фронтовых тестов","pf":1.0,"mf":0.5,"result":"заметка","desc":"Зафиксировать, что админка на jQuery/Inspinia, сборка через uglify, Nightwatch мёртв. Не предлагать переписывать админку — только что тестируем Playwright'ом."},{"title":"Конфиг YAML vs аннотации, ручной DI","pf":0.5,"mf":0.5,"result":"карта сервисов","desc":"Где сервисы в YAML, где аннотации, где $this->get(). Карта нужна, чтобы не ломать DI на апгрейде и писать новый код единообразно."},{"title":"Отчёт «что блокирует Symfony 4/5/6/7»","pf":1.5,"mf":0.5,"result":"вход в этап 08","desc":"Сводка блокеров по мажорам: SensioDistribution, Assetic, Swiftmailer, FOSUser, JMS i18n, Payum, PHP 8. Это вход в этап 08, не начало апгрейда."}]},{"id":"01.04","title":"Почему возникают регрессии","pkg":"I","why":"Связать реальные баги с отсутствием границ модулей и тестов.","done":"1–2 страницы причин + какие типы тестов каждую закрывают.","deps":"01.02","role":"Senior Symfony","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Разбор 5–8 недавних багов «побочный эффект»","pf":2.0,"mf":0.5,"result":"разбор по git/тикетам","desc":"Взять реальные тикеты/коммиты, где правка A сломала B. Для каждого: файлы, почему не поймали тестом, какой тип теста закрыл бы кейс."},{"title":"Границы модулей: Catalog→Cart, Cron→Product","pf":1.5,"mf":0.5,"result":"схема связности","desc":"Показать прямые обращения между бандлами без сервиса-фасада. Где Catalog пишет в корзину и cron правит Product — там нужны интеграционные тесты, не unit."},{"title":"Мультиязычность (JMS i18n, 10 доменов)","pf":1.0,"mf":0.5,"result":"риск-заметка","desc":"Описать, как JMS i18n-routing режет URL по хостам en/fr/de/…. Правка роута без выборки локалей даёт 404 на половине доменов."},{"title":"Админские массовые команды без dry-run","pf":1.0,"mf":0.5,"result":"список опасных команд","desc":"Список команд, которые массово меняют цены, сток, видимость, переводы. Отметить отсутствие dry-run и тестов — риск «прогнали на проде»."}]},{"id":"01.05","title":"Инвентаризация текущего покрытия","pkg":"I","why":"Зафиксировать фактическое состояние покрытия. Задача не блокирует начало 02.01.","done":"Таблица потоков: есть тест / нет / мёртвый. PHPUnit suite зелёный или явно красный с причиной.","deps":"Нет. Выполняется параллельно с этапом 02.","role":"Midd zy vs extra queries","pf":1.5,"mf":0.5,"result":"N+1 кандидаты","desc":"По карточке и листингу прикинуть translations/visibilities/цены. Зафиксировать N+1-гипотезы для этапа 07."},{"title":"Картинки LiipImagine, Assetic","pf":1.0,"mf":0.5,"result":"заметка","desc":"Как генерируются пресеты, webp, кто жмёт CSS/JS. Assetic не развиваем — только понять узкое место картинок."},{"title":"Redis-сессии, Typesense/Algolia","pf":1.0,"mf":0.5,"result":"заметка","desc":"Сессии в Redis уже есть. Поиск и внешние вызовы: таймауты, что видит пользователь при down. Гипотезы деградации."},{"title":"Гипотезы ускорения","pf":0.5,"mf":0.5,"result":"вход в этап 07","desc":"Короткий список «сделать X → ожидаемый эффект», без внедрения. Приоритет для этапа 07 после тестов."}]},{"id":"01.09","title":"Итоговый отчёт аудита","pkg":"I","why":"Сводный отчёт для заказчика. Может уточнить оценки этапов 03–08; уже начатые работы этапов 02 и 03 не останавливает.","done":"Отчёт RU + 1 час презентации. Оценки скорректированы ±15%.","deps":"01.01–01.08","role":"Lead","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Единый отчёт: риски, приоритеты, что не трогаем","pf":2.5,"mf":1.0,"result":"PDF/MD заказчику","desc":"Собрать 01.01–01.08 в документ для заказчика на русском: риски, пакеты I–III, что не переписываем."},{"title":"Уточнение бэклога следующих этапов","pf":1.5,"mf":0.5,"result":"апдейт оценок","desc":"После фактов сдвинуть оценки B–H на ±15%, не переписывая план с нуля."},{"title":"Короткая презентация","pf":1.5,"mf":0.5,"result":"1 час","desc":"Час с заказчиком/ПМ: три пакета, порядок «тесты → Symfony», решение по пакету I."}]}]},{"id":"02","title":"Инструменты, CI и первое покрытие","goal":"Первый этап изменений в репозитории: рабочий PHPUnit и смоук-тесты витрины (02.08) до завершения PHPStan и Pipelines. Процесс выкладки master/develop не изменяется.","pfD":6.5,"mfD":3.0,"color":"blue","tasks":[{"id":"02.01","title":"PHPUnit 9, тестовая БД, фикстуры","pkg":"I","why":"Текущий phpunit.xml рассчит :"Middle (JS/PHP)","pfH":7.5,"mfH":3.0,"subtasks":[{"title":"Playwright + Chromium в CI","pf":1.5,"mf":0.5,"result":"прогон в pipeline","desc":"Nightwatch не используем. Playwright + Chromium в образе pipeline. Один прогон должен быть воспроизводим локально."},{"title":"Page objects: Home, Product, Cart, Login","pf":2.5,"mf":1.0,"result":"модули","desc":"Вынести селекторы в page objects, не хардкодить xpath в каждом тесте. Иначе E2E разъедутся после правки вёрстки."},{"title":"Smoke: главная → карточка → add to cart","pf":1.5,"mf":0.5,"result":"1 зелёный сценарий","desc":"Один сквозной happy-path на фикстурном товаре. Это E2E-якорь пакета I, не покрытие всей витрины."},{"title":"Тестовые хосты локалей","pf":1.0,"mf":0.5,"result":"как config_test","desc":"Хосты как в config_test (localhost, de.localhost…). Иначе JMS i18n-routing отдаст не ту локаль."},{"title":"Решение PR vs nightly","pf":1.0,"mf":0.5,"result":"smoke на PR","desc":"Зафиксировать: smoke на каждом PR, полный набор Playwright — nightly. Иначе CI станет часовым."}]},{"id":"02.05","title":"Bitbucket Pipelines на PR","pkg":"I","why":"Сейчас default = echo nothing. Нужны проверки без смены rsync на прод.","done":"PR: composer, phpunit, phpstan. develop/master: сначала тесты, затем существующий rsync. Запрет выкладки при красной сборке включается в 04.01.","deps":"02.01, 02.02","role":"Middle+ / DevOps","pfH":10.0,"mfH":4.0,"subtasks":[{"title":"Docker-образ PHP 7.4 + MySQL + Redis в pipeline","pf":3.0,"mf":1.0,"result":"services в yml","desc":"В Bitbucket services: PHP 7.4, MySQL, Redis. Сейчас default pipeline ничего не делает. Без этого phpunit в CI не стартует."},{"title":"Шаги PR: composer, phpunit, phpstan","pf":2.5,"mf":1.0,"result":"default pipeline","desc":"На pull request: install, phpunit, phpstan baseline. Не деплоить с default-ветки."},{"title":"Кэш composer","pf":1.0,"mf":0.5,"result":"быстрее билды","desc":"Кэшировать vendor/composer, чтобы PR не ставил пакеты с нуля каждый раз."},{"title":"Fail-fast, артефакт JUnit","pf":1.0,"mf":0.5,"result":"отчёт в BB","desc":"Падать на первой красной сюите, прикладывать JUnit-отчёт в Bitbucket, чтобы ПМ/разраб видел что сломалось."},{"title":"develop/master: сначала тесты, потом rsync","pf":1.5,"mf":0.5,"result":"порядок шагов","desc":"Порядок шагов: тесты, затем существующий rsync. Сам rsync не переписывать. Запрет выкладки при красной сборке включается в 04.01 после устойчивого покрытия C1."},{"title":"Тестовые ключи платежей (заглушки)","pf":1.0,"mf":0.5,"result":"secured variables","desc":"В secured variables — фейковые ключи PSP, не прод. Тесты не ходят в боевые шлюзы."}]},{"id":"02.06","title":"Изоляция данных и моки HTTP","pkg":"I","why":"Тесты не должны ходить в прод, PSP, Typesense, Make.com.","done":"Отдельный dbname, защита в bootstrap, обрезанный дамп без PII, моки HTTP.","deps":"02.01","role":"Middle+","pfH":6.5,"mfH":3.0,"subtasks":[{"title":"Запрет тестов на продовой БД","pf":1.0,"mf":0.5,"result":"проверка в bootstrap","desc":"В bootstrap проверить dbname/host. Если случайно продовый — exit. Инцидент «тесты потёрли заказы» недопустим."},{"title":"Обрезанный дамп схемы без PII","pf":2.5,"mf":1.0,"result":"fixture dump","desc":"Схема + минимум справочников, без email/адресов клиентов. Нужен воспроизводимый dump для CI и новых разработчиков."},{"title":"Моки: платежи, Typesense, Mailchimp, Make.com","pf":2.5,"mf":1.0,"result":"HTTP stubs","desc":"HTTP-заглушки на внешние API. Functional-тесты не зависят от сети и не дёргают Make.com webhook из репо."},{"title":"Почтовый перехват (disable_delivery)","pf":0.5,"mf":0.5,"result":"уже частично есть","desc":"Swiftmailer disable_delivery в test уже есть — проверить, что письма не уходят наружу и их можно прочитать в тесте reset password."}]},{"id":"02.07","title":"Шаблоны тестов для команды","pkg":"I","why":"Единый стиль unit-, functional- и браузерных тестов.","done":"Три шаблона и внутренний стандарт оформления тестов в репозитории.","deps":"02.01, 02.04","role":"Lead","pfH":4.0,"mfH":2.0,"subtasks":[{"title":"Шаблон unit-теста сервиса","pf":1.0,"mf":0.5,"result":"пример в tests/","desc":"Эталонный unit-тест в tests/: моки, именование, утверждения. Команда использует его как образец."},{"title":"Шаблон functional-теста контроллера","pf":1.0,"mf":0.5,"result":"пример","desc":"Эталон: логин через базовый класс, фикстура, запрос, статус, не лезть в html целиком без нужды."},{"title":"Шаблон Playwright","pf":1.0,"mf":0.5,"result":"пример","desc":"Эталон smoke с page object. Запрет sleep(5000) как в старом Nightwatch — явные waitFor."},{"title":"Внутренний стандарт оформления тестов","pf":1.0,"mf":0.5,"result":"единый стиль","desc":"Правило в репозитории: новая логика принимается вместе с тестом; стиль — по утверждённым шаблонам. Запрещены тесты с боевыми учётными данными."}]},{"id":"02.08","title":"Первое покрытие витрины (кусок 03)","pkg":"I","why":"После внедрения PHPUnit в репозитории должен появиться набор тестов, фиксирующий ошибки 500 на витрине. Трудозатраты перенесены с начала 03.08 и смоук-сценариев 03.01–03.04, в общий объём не добавляются.","done":"GET главной, категории, карточки, /cart/, /login и 10–15 публичных роутов не отдают 500. Suite в CI, как только готов 02.05.","deps":"02.01 и 02.06. PHPStan, Playwright и Pipelines не блокируют.","role":"Middle+","pfH":6.5,"mfH":2.5,"subtasks":[{"title":"GET главной, категории, карточки (фикстурный товар)","pf":2.5,"mf":1.0,"result":"200, не 500","desc":"Functional на фикстурах: /, категория, карточка доступного товара. Ловим 500 после правки Twig/роута. Дальше 03.01 углубляет фильтры и i18n, не дублирует эти GET."},{"title":"GET /cart/ и /login","pf":1.5,"mf":0.5,"result":"якорь корзины и логина","desc":"Дым корзины и логина без сценариев промокода/регистрации. Это якорь пакета I, пока 03.02/03.04 пишутся рядом."},{"title":"10–15 публичных GET из роутера (старт 03.08)","pf":1.5,"mf":0.5,"result":"параметризованный дым","desc":"Параметризованный тест выборки публичных GET: не 500. Полный список роутов и админ-smoke остаются в 03.08."},{"title":"Включить набор в CI после готовности 02.05","pf":1.0,"mf":0.5,"result":"PR краснеет при 500","desc":"После появления phpunit в Pipelines этот набор становится обязательным. Завершение этапа 02 для этого не требуется: регресс витрины фиксируется раньше."}]}]},{"id":"03","title":"Автотесты критических потоков","goal":"Регресс витрины, корзины, оплаты и админки блокирует выкладку. Старт в тот же день, когда зелёные 02.01+02.06; кусок дымов уже в 02.08.","pfD":18.0,"mfD":8.0,"color":"purple","tasks":[{"id":"03.01","title":"Каталог, карточка, поиск, i18n","pkg":"I","why":"Типичный источник регрессий витрины. GET главной, категории и карточки входят в 02.08; на этапе 03 — фильтры, i18n и поиск.","done":"Functional: listing, карточка (вкл/выкл/нет slug), выборка локалей, фильтры, мок поиска. Playwright: категория → карточка.","deps":"02.01 и 02.06. Допускается параллельно с 02.02–02.05 и 02.08.","role":"Middle+","pfH":20.5,"mfH":9.0,"subtasks":[{"title":"Listing категории: 200, пагинация, пустая","pf":2.5,"mf":1.0,"result":"functional","desc":"Functional: категория с товарами отдаёт 200 и пагинацию; пустая категория — не 500, а пустой листинг. Ломается при правке репозитория/Twig."},{"title":"Карточка: доступен / выключен / удалён / нет slug","pf":3.5,"mf":1.5,"result":"functional","desc":"Четыре состояния товара: 200 если доступен в локали; 404/редирект если выключен, удалён или нет slug. Это частый «побочный» баг видимости."},{"title":"Мультиязычные URL — выборка, не 10×N","pf":3.5,"mf":1.5,"result":"параметризованный тест","desc":"Параметризованный тест на 2–3 локали и 2–3 роута, не декартово произведение всех доменов. Ловим, что JMS-префикс локали не даёт 404."},{"title":"Фильтры не ломают SQL","pf":2.5,"mf":1.0,"result":"functional","desc":"Прогнать фильтр цены и 1–2 атрибута. Ожидание: 200 и валидный SQL, не исключение Doctrine на пустом/крайнем диапазоне."},{"title":"Поиск: мок Typesense/Algolia + 1 functional","pf":2.5,"mf":1.0,"result":"без живого API","desc":"Клиент поиска мокаем. Один functional: страница поиска не 500, отдаёт заглупленные хиты. Живой кластер в CI не нужен."},{"title":"Коллекции / outlet / sitemap 200","pf":2.0,"mf":1.0,"result":"smoke","desc":"Дымовые GET коллекций, outlet и sitemap.xml. Часто отваливаются после правки роутинга/PrestaSitemap."},{"title":"Unit: Product::isAvailable(locale)","pf":2.0,"mf":1.0,"result":"unit","desc":"Юнит на доступность по локали/флагам isEnabled/isDeleted/visibility. Правило живёт в сущности и дублируется в Twig — тест на канон."},{"title":"Playwright: категория → карточка","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: открыть фикстурную категорию, клик в карточку, виден title. Проверяет, что десктопный шаблон и ссылки живы."}]},{"id":"03.02","title":"Корзина","pkg":"I","why":"CartController ~87 КБ, любая правка цен/qty бьёт чекаут.","done":"Add/update/remove, слияние гость→логин, промокод, валюта/страна, недоступный товар. Playwright до страницы корзины.","deps":"03.01","role":"Senior / Middle+","pfH":17.5,"mfH":7.5,"subtasks":[{"title":"Добавление, qty, удаление","pf":3.5,"mf":1.5,"result":"functional","desc":"Functional: add to cart, смена количества, удаление строки. Корзина в сессии/БД согласована, не 500 на CartController."},{"title":"Гость → логин, слияние корзины","pf":2.5,"mf":1.0,"result":"functional","desc":"Гость кладёт товар, логинится — позиции не пропадают и не дублируются. Типичный баг слияния корзин."},{"title":"Промокод / кредит / минимальная сумма","pf":2.5,"mf":1.0,"result":"functional","desc":"Три ветки: валидный промокод, кредит пользователя, отказ при сумме ниже минимума. Не ходить в реальный PSP."},{"title":"Пересчёт при смене страны/валюты","pf":2.5,"mf":1.0,"result":"functional","desc":"Смена страны/валюты в корзине пересчитывает shipping и итог, не оставляет старую цену в сессии."},{"title":"Недоступный товар в корзине","pf":2.0,"mf":1.0,"result":"functional","desc":"Товар выключили после add: корзина показывает ошибку/удаление, чекаут не создаёт заказ с призраком."},{"title":"Unit расчёта итогов (если можно вынести)","pf":2.5,"mf":1.0,"result":"unit/сервис","desc":"Если итоги ещё в контроллере — написать тест на текущий путь; лучше вынести сервис (это же кандидат 05.03) и покрыть unit'ом."},{"title":"Playwright: add to cart → корзина","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: кнопка add, переход в корзину, видна строка товара. Без оплаты."}]},{"id":"03.03","title":"Чекаут и платежи","pkg":"I","why":"Деньги. Реальные PSP в тестах не вызываем — фейковый Payum + фикстуры notify.","done":"Создание Purchase, идемпотентность, фейковый capture, 1 webhook happy+fail на каждый живой шлюз. Остальные шлюзы можно вынести в follow-up пакета II, не снимая happy-path из C1.","deps":"03.02, 02.06","role":"Senior","pfH":28.5,"mfH":11.5,"subtasks":[{"title":"Чекаут: адрес, доставка, Purchase","pf":5.0,"mf":2.0,"result":"functional C1","desc":"Functional C1: заполнить адрес, выбрать доставку, создать Purchase в тестовой БД. Якорь денег до шлюза."},{"title":"Идемпотентность повторного сабмита","pf":2.0,"mf":1.0,"result":"не два заказа","desc":"Двойной submit не создаёт два заказа. F5/повтор POST — частый баг чекаута."},{"title":"Фейковый capture → статус оплачен","pf":4.0,"mf":1.5,"result":"C1","desc":"Payum gateway-заглушка: capture успешен, статус Purchase = оплачен. Реальный Stripe/Hipay в CI не вызываем."},{"title":"Notify каждого живого шлюза: happy + fail","pf":8.5,"mf":3.0,"result":"можно резать по PSP","desc":"По каждому PSP из payment_methods.yml: валидный notify двигает статус, невалидный — нет. Можно резать по шлюзам follow-up'ами, но happy-path C1 обязателен."},{"title":"Chargeback Hipay без реальных денег","pf":2.0,"mf":1.0,"result":"C2 ок","desc":"Прогнать ветку chargeback/статус на фикстуре Hipay. Можно в волне C2, но не забыть — бухгалтерия сидит на этом."},{"title":"3DS редирект (мок)","pf":2.0,"mf":1.0,"result":"не 500","desc": ,"mf":0.5,"result":"E2E","desc":"E2E логин тестовым юзером и открытие /account. Проверка десктопного шаблона кабинета."}]},{"id":"03.05","title":"Админка: товары, цены, заказы","pkg":"II","why":"ProductController ~113 КБ — главный источник побочных багов.","done":"RBAC по security.yml, сохранить товар (цена/видимость/slug), 1 массовая цена, смена статуса заказа, дымовые списки. Playwright: админ → карточка товара.","deps":"03.04, 02.01","role":"Senior / Middle+","pfH":19.0,"mfH":8.0,"subtasks":[{"title":"RBAC: ROLE_* не видят чужие разделы","pf":2.5,"mf":1.0,"result":"functional","desc":"По security.yml: бухгалтер не видит товары, интегратор — не платежи. Functional с разными ролями, не один SUPER_ADMIN на все тесты."},{"title":"Создание/редактирование товара","pf":4.5,"mf":1.5,"result":"цена, видимость, slug","desc":"Сохранить товар: цена, видимость, slug. После сейва карточка на витрине в ожидаемом состоянии. ProductController — главный риск."},{"title":"Массовые цены / страны — хотя бы 1 команда","pf":2.5,"mf":1.0,"result":"command test","desc":"Тест одной админской команды массовых цен (dry-run если есть, иначе на фикстуре). Не прогонять все Update*Command."},{"title":"Смена статуса заказа + письма (мок)","pf":3.5,"mf":1.5,"result":"functional","desc":"Сменить статус Purchase в админке, письмо уходит в перехват, побочные поля (склад/оплата) согласованы."},{"title":"Список заказов: фильтры не падают","pf":2.0,"mf":1.0,"result":"smoke","desc":"Админ-список с 2–3 фильтрами: 200, не timeout/500 на пустой выборке."},{"title":"Дизайнеры / категории — GET 200 после логина","pf":2.0,"mf":1.0,"result":"smoke","desc":"Дым ключевых админ-GET после логина ROLE_ADMIN_INTEGRATION. Не покрываем всю Inspinia."},{"title":"Playwright: логин админа → товар","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: админ логинится, открывает карточку товара в админке. Селекторы Inspinia вынести в page object."}]},{"id":"03.06","title":"Кроны и связка PF ↔ MF","pkg":"II","why":"CronBundle ~41k сть.","deps":"02.04, 03.01, 03.02","role":"Middle (JS)","pfH":7.0,"mfH":3.0,"subtasks":[{"title":"Playwright: поиск Typesense desktop/mobile","pf":2.5,"mf":1.0,"result":"E2E","desc":"Живой JS поиска: ввод запроса, видны саджесты/результаты на desktop и mobile шаблоне. API можно мокать на уровне сети."},{"title":"Мини-корзина / ajax add","pf":2.5,"mf":1.0,"result":"E2E","desc":"Ajax add без перезагрузки, мини-корзина обновляется. Ловим поломку JS корзины, которую PHPUnit не видит."},{"title":"Чекаут JS-валидация","pf":2.0,"mf":1.0,"result":"если есть на проде","desc":"Если на проде есть JS-валидация шагов — прогнать ошибку пустого поля. Нет JS — закрыть подзадачу пометкой, не писать мёртвый тест."}]},{"id":"03.10","title":"Стабилизация suite","pkg":"II","why":"Flaky тесты убьют доверие к CI. Цель: PHPUnit < 15 мин, flaky < 2%.","done":"Удалены заглушки Hello World. Набор C1 устойчив 5 рабочих дней. Отчёт coverage по бандлам — для заказчика, не критерий слияния.","deps":"03.01–03.09","role":"Lead + Middle","pfH":7.5,"mfH":3.5,"subtasks":[{"title":"Вычистить flaky (сессии, процессы, таймзоны)","pf":2.5,"mf":1.0,"result":"стабильный прогон","desc":"Убрать runInSeparateProcess где не нужно, зафиксировать TZ/locale, не зависеть от «живых» 20 товаров из БД как в старом CatalogBundleTest."},{"title":"Параллельность, если CI позволяет","pf":1.5,"mf":0.5,"result":"время прогона","desc":"Включить параллельный phpunit только если нет общей БД-гонки. Иначе оставить последовательно, не плодить flaky."},{"title":"Цель unit+functional < 15 мин на PR","pf":2.0,"mf":1.0,"result":"метрика","desc":"Замерить время, урезать лишние boot kernel, не грузить 20 карточек в одном тесте. Долгий suite никто не запускает."},{"title":"Удалить мёртвые DefaultControllerTest","pf":0.5,"mf":0.5,"result":"нет Hello World","desc":"Hello World и assertContains('200') в content — удалить. Они красные или бессмысленные и дискредитируют CI."},{"title":"Отчёт coverage по бандлам","pf":1.0,"mf":0.5,"result":" »."},{"title":"Чеклист PR (Bitbucket template)","pf":1.0,"mf":0.5,"result":"template","desc":"Шаблон PR: что изменено, как проверить, какой тест добавлен. Исключения — в следующем пункте."},{"title":"Исключения: переводы, контентный Twig","pf":0.5,"mf":0.5,"result":"в шаблоне","desc":"Явно разрешить без теста: xlf, копирайт в статическом Twig без логики. Иначе процесс ненавидят."},{"title":"Правило приёмки: нет теста — нет закрытия задачи","pf":1.0,"mf":0.5,"result":"стандарт репозитория","desc":"Фиксация в стандарте команды: задача не принимается без теста (кроме исключений 04.02)."}]},{"id":"04.03","title":"TDD для новой бизнес-логики","pkg":"I","why":"На 500 КБ командах TDD нереален. На новом коде и выносимых сервисах — да.","done":"Гайд red→green→refactor + 2 учебных примера на живом мелком тикете.","deps":"04.02","role":"Lead","pfH":4.0,"mfH":2.0,"subtasks":[{"title":"Короткий внутренний гайд TDD","pf":1.0,"mf":0.5,"result":"1–2 страницы","desc":"1–2 страницы: red → green → refactor. Только новый код и выносимые сервисы, не 500 КБ команд."},{"title":"2 учебных примера на живом тикете","pf":2.5,"mf":1.0,"result":"парное/демо","desc":"Два мелких реальных тикета провести в TDD с командой, чтобы гайд не остался файлом в docs."},{"title":"Хотфикс прода: тест в том же PR","pf":0.5,"mf":0.5,"result":"исключение в гайде","desc":"Исключение: можно сначала фикс на прод, но тест в том же PR до merge в develop. Не «тесты потом никогда»."}]},{"id":"04.04","title":"Фичи отдельно от upgrade-веток","pkg":"I","why":"Смешать фичу магазина и Rector — неразбираемый конфликт.","done":"Правило веток feature/* vs upgrade/sfXX. В оценках новых фич +20–40% на тесты.","deps":"04.01","role":"PM + Lead","pfH":1.5,"mfH":1.5,"subtasks":[{"title":"Фича не в том же PR, что Rector/upgrade","pf":0.5,"mf":0.5,"result":"правило","desc":"Запрет смешивать фичу магазина и массовый Rector/SF-апгрейд. Иначе неразбираемый конфликт и откат всего."},{"title":"Ветки feature/*, test/*, upgrade/sfXX","pf":0 :"02.03, 03 C1 зелёный","role":"Senior","pfH":8.0,"mfH":3.0,"subtasks":[{"title":"DeadCode по бандлу, 1 бандл = 1 PR","pf":3.0,"mf":1.0,"result":"серия PR","desc":"Rector DeadCode по одному бандлу, каждый PR зелёный на suite. Один гигантский diff не ревьюится."},{"title":"CodeQuality без смены поведения","pf":2.5,"mf":1.0,"result":"PR","desc":"Правила качества, которые не меняют бизнес-логику. Перед мержем — phpunit. Поведенческие наборы — в 08."},{"title":"Запрет опасных правил до апгрейда PHP","pf":1.0,"mf":0.5,"result":"rector.php","desc":"В rector.php запретить attributes PHP 8, rename methods, Symfony 4+ sets. Иначе сломаем 3.4."},{"title":"PHPUnit + smoke после каждого PR","pf":1.5,"mf":0.5,"result":"зелёный CI","desc":"Чек-лист мержа Rector: phpunit C1 и Playwright smoke. Красный — revert, не «починим следующим коммитом»."}]},{"id":"05.03","title":"Вынос 5 сервисов из god-классов","pkg":"II","why":"Не «разнести всё». Только то, что закрыто тестами и мешает жить.","done":"5 сервисов (итоги корзины, статус заказа, available, цена по стране, +1 из аудита). Static-page команды 500 КБ не трогаем.","deps":"01.02, 03.02, 03.05, 04.03","role":"Senior","pfH":20.0,"mfH":8.0,"subtasks":[{"title":"Выбор 5 целей по карте риска 01.02","pf":1.0,"mf":0.5,"result":"список","desc":"Выбрать 5 кусков из god-классов, уже закрытых тестами: итоги корзины, статус заказа, isAvailable, цена по стране, +1 из аудита."},{"title":"TDD: сервис 1","pf":4.0,"mf":1.5,"result":"вынесен + тесты","desc":"Вынести первый сервис по TDD: сначала тест на текущее поведение, потом класс, контроллер тонкий. Кандидат: расчёт итогов корзины."},{"title":"TDD: сервис 2","pf":4.0,"mf":1.5,"result":"вынесен + тесты","desc":"Второй сервис. Кандидат: смена статуса заказа (письма мокаем)."},{"title":"TDD: сервис 3","pf":4.0,"mf":1.5,"result":"вынесен + тесты","desc":"Третий сервис. Кандидат: доступность товара по локали, чтобы убрать дубль Twig/PHP."},{"title":"TDD: сервис 4","pf":3.5,"mf":1.5,"result":"вынесен f":0.5,"result":"ревью","desc":"Ревью native SQL: нет ли динамических кусков. Не запрещать native SQL, запретить небезопасную сборку."},{"title":"Чеклист прав БД php-пользователя","pf":1.0,"mf":0.5,"result":"инфра","desc":"Прод-пользователь PHP не root, без DROP/FILE если не нужно. Чеклист инфры, не обязательно менять код."},{"title":"PII в логах и фикстурах","pf":1.5,"mf":0.5,"result":"вычистить","desc":"Убрать email/телефоны/адреса из логов и тестовых фикстур. Старый UserControllerTest с реальным ящиком — удалить."}]},{"id":"06.04","title":"Composer audit и патчи без смены Symfony","pkg":"II","why":"В composer.json audit.block-insecure: false.","done":"Audit в CI как report. Обновлены пакеты, которые можно без мажора Symfony. block-insecure: true — после волны H.","deps":"01.03","role":"Middle+","pfH":6.0,"mfH":3.0,"subtasks":[{"title":"Audit в CI (report, не block)","pf":1.0,"mf":0.5,"result":"pipeline","desc":"composer audit в pipeline как warning/report. block-insecure пока false — иначе встанем на CVE, которые чинятся только SF-апгрейдом."},{"title":"Обновить пакеты без смены Symfony-мажора","pf":3.5,"mf":1.5,"result":"PR","desc":"Патч/минор пакетов, совместимых с 3.4/PHP 7.4. Не трогать symfony/symfony 3.4.47 в этом тикете."},{"title":"Зафиксировать пакеты, ждущие PHP 8","pf":1.0,"mf":0.5,"result":"список","desc":"Список «обновим в 08.xx». Чтобы не тратить дни на невозможный апдейт сейчас."},{"title":"Пометка: block-insecure после 08","pf":0.5,"mf":0.5,"result":"тикет-напоминание","desc":"Тикет-напоминание: после 7.4 включить block-insecure true. Не забыть, иначе audit снова декоративный."}]},{"id":"06.05","title":"Сессии, загрузка файлов, headers","pkg":"II","why":"cookie_secure уже true; сверить остальное с nginx.","done":"Флаги сессии, проверка upload в админке, debug-бандлы только local/dev.","deps":"01.07","role":"Middle+","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Session Redis, cookie flags","pf":1.5,"mf":0.5,"result":"сверка","desc":"Сверить cookie_sec function readLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ru") return q;
  try {
    const stored = localStorage.getItem("plan-lang");
    if (stored === "en" || stored === "ru") return stored;
  } catch (e) {}
  return "en";
}

let lang = readLang();
let EPICS = EPICS_BY_LANG[lang];
let pkg = "all";
let plat = "both";
let selected = "01.01";

function t(key) { return UI[lang][key]; }

function hours(task) {
  if (plat === "pf") return task.pfH;
  if (plat === "mf") return task.mfH;
  return task.pfH + task.mfH;
}
function hLabel(pf, mf) {
  const u = t("h");
  if (plat === "pf") return pf + " " + u;
  if (plat === "mf") return mf + " " + u;
  return pf + " / " + mf + " " + u;
}
function dLabel(pf, mf) {
  const u = t("d");
  if (plat === "pf") return pf + " " + u;
  if (plat === "mf") return mf + " " + u;
  return pf + " / " + mf + " " + u;
}
function findTask(id) {
  for (const e of EPICS) {
    const task = e.tasks.find(x => x.id === id);
    if (task) return { epic: e, task };
  }
}
function visibleTasks(epic) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return epic.tasks.filter(task => {
    if (pkg !== "all" && task.pkg !== pkg) return false;
    if (!q) return true;
    const blob = [task.id, task.title, task.why, task.done, ...task.subtasks.map(s => s.title + " " + (s.desc || "") + " " + s.result)].join(" ").toLowerCase();
    return blob.includes(q);
  });
}
function ticketText(epic, task) {
  const estimate = plat === "pf"
    ? task.pfH + " " + t("h") + " (Privatefloor)"
    : plat === "mf"
      ? task.mfH + " " + t("h") + " (MyFaktory)"
      : task.pfH + " " + t("h") + " PF + " + task.mfH + " " + t("h") + " MF. " + t("bothTickets");
  const sub = task.subtasks.map(s => {
    const d = s.desc ? "\n      " + s.desc : "";
    return "- [ ] " + s.title + " (" + hLabel(s.pf, s.mf) + ") — " + s.result + d;
  }).join("\n");
  const platName = plat === "both" ? "Privatefloor + MyFaktory" : plat === "pf" ? "Privatefloor" : "MyFaktory";
  return "[STAB-" + task.id + "] " + task.title + "\n\n"
    + t("package") + ": " + task.pkg + " · " + t("stage") + ": " + epic.id + " " + epic.title + "\n"
    + t("platform") + ": " + platName + "\n"
    + t("estimate") + ": " + estimate + "\n"
    + t("role") + ": " + task.role + "\n"
    + t("deps") + ": " + task.deps + "\n\n"
    + t("why") + "\n" + task.why + "\n\n"
    + t("doneWhen") + "\n" + task.done + "\n\n"
    + t("subtasks") + "\n" + sub + "\n\n"
    + t("doNot");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function hoursLabel() {
  return plat === "both" ? t("hoursBoth") : plat === "pf" ? t("hoursPf") : t("hoursMf");
}
function renderTree() {
  const root = document.getElementById("tree");
  let html = "";
  let n = 0, h = 0;
  for (const epic of EPICS) {
    const tasks = visibleTasks(epic);
    if (!tasks.length) continue;
    n += tasks.length;
    h += tasks.reduce((a, task) => a + hours(task), 0);
    html += '<details class="epic" open><summary><span class="grow">'
      + esc(epic.id) + " · " + esc(epic.title)
      + '</span><span class="meta">' + tasks.length + " " + esc(t("tasksShort")) + " · " + esc(dLabel(epic.pfD, epic.mfD)) + "</span></summary>";
    html += '<p class="why" style="padding:0 14px 8px 14px">' + esc(epic.goal) + "</p>";
    for (const task of tasks) {
      const open = task.id === selected ? " open" : "";
      const sel = task.id === selected ? " open-selected" : "";
      html += '<details class="task' + sel + '"' + open + ' data-id="' + esc(task.id) + '">';
      html += '<summary><span class="pkg ' + task.pkg + '">' + esc(t("pkgChip")) + " " + task.pkg + "</span>";
      html += '<span class="grow">' + esc(task.id) + "  " + esc(task.title) + "</span>";
      html += '<span class="meta">' + esc(hLabel(task.pfH, task.mfH)) + "</span></summary>";
      html += '<div class="body"><p class="why">' + esc(task.why) + "</p>";
      html += '<button type="button" class="ghost pick" data-id="' + esc(task.id) + '">' + esc(t("ticketCard")) + "</button>";
      html += "<table><thead><tr><th>" + esc(t("colSub")) + "</th><th>" + esc(t("colDesc")) + "</th><th class='num'>PF</th><th class='num'>MF</th><th>" + esc(t("colDone")) + "</th></tr></thead><tbody>";
      for (const s of task.subtasks) {
        html += "<tr><td>" + esc(s.title) + "</td><td>" + esc(s.desc || "—") + "</td><td class='num'>" + s.pf + " " + esc(t("h")) + "</td><td class='num'>" + s.mf + " " + esc(t("h")) + "</td><td>" + esc(s.result) + "</td></tr>";
      }
      html += "</tbody></table></div></details>";
    }
    html += "</details>";
  }
  root.innerHTML = html || "<p>" + esc(t("empty")) + "</p>";
  document.getElementById("s-tasks").textContent = n;
  document.getElementById("s-hours").textContent = Math.round(h) + " " + t("h");
  document.getElementById("s-days").textContent = (h / 8).toFixed(0) + " " + t("d");
  document.getElementById("s-hours-label").textContent = hoursLabel();
  bindTree();
  renderCard();
}
function bindTree() {
  document.querySelectorAll(".pick").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      selected = btn.getAttribute("data-id");
      renderTree();
      document.getElementById("card").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  });
  document.querySelectorAll(".task > summary").forEach(s => {
    s.addEventListener("click", () => {
      const id = s.parentElement.getAttribute("data-id");
      if (id) selected = id;
      setTimeout(renderCard, 0);
    });
  });
}
function renderCard() {
  const el = document.getElementById("card");
  const found = findTask(selected);
  if (!found) {
    el.innerHTML = '<p class="id">' + esc(t("cardHintId")) + "</p><p>" + esc(t("cardHint")) + "</p>";
    return;
  }
  const { epic, task } = found;
  const text = ticketText(epic, task);
  el.innerHTML =
    '<p class="id">' + esc(task.id) + " · " + esc(t("cardMeta")) + " " + task.pkg + " · " + esc(task.role) + "</p>"
    + "<h2>" + esc(task.title) + "</h2>"
    + '<p class="why">' + esc(dLabel(epic.pfD, epic.mfD)) + " " + esc(t("epicDays")) + " · " + esc(t("taskEst")) + " " + esc(hLabel(task.pfH, task.mfH)) + "</p>"
    + "<h3>" + esc(t("why")) + "</h3><p>" + esc(task.why) + "</p>"
    + "<h3>" + esc(t("doneWhen")) + "</h3><p>" + esc(task.done) + "</p>"
    + "<h3>" + esc(t("deps")) + "</h3><p>" + esc(task.deps) + "</p>"
    + '<div class="row"><button type="button" class="primary" id="copy">' + esc(t("copy")) + "</button></div>"
    + "<h3>" + esc(t("ticketFor")) + "</h3>"
    + '<textarea id="ticket" readonly></textarea>';
  el.querySelector("#ticket").value = text;
  el.querySelector("#copy").onclick = async () => {
    const ta = el.querySelector("#ticket");
    try {
      await navigator.clipboard.writeText(ta.value);
      el.querySelector("#copy").textContent = t("copied");
      setTimeout(() => { el.querySelector("#copy").textContent = t("copy"); }, 1500);
    } catch {
      ta.select();
      document.execCommand("copy");
    }
  };
}
function setLang(next) {
  if (next !== "en" && next !== "ru") return;
  lang = next;
  EPICS = EPICS_BY_LANG[lang];
  try { localStorage.setItem("plan-lang", lang); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  applyChrome();
  renderTree();
}
