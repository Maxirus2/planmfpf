<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stabilisation of Privatefloor and MyFaktory — task backlog</title>
<style>
  :root {
    --bg: #f4f3ef;
    --paper: #fff;
    --ink: #1c1c1c;
    --muted: #5c5c5c;
    --line: #e2e0d8;
    --accent: #1f4e79;
    --accent-soft: #e8eef4;
    --pkg1: #1f4e79;
    --pkg2: #3d6b4f;
    --pkg3: #8a5a12;
    --ok: #2c6e49;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 28px 32px 20px;
  }
  header h1 { margin: 0 0 8px; font-size: 24px; font-weight: 650; }
  header .lead { margin: 0; color: var(--muted); max-width: 860px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 16px 0 20px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 14px 16px;
  }
  .stat b { display: block; font-size: 22px; font-weight: 650; }
  .stat span { color: var(--muted); font-size: 12px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 12px;
  }
  .filters button, .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
    color: var(--ink);
  }
  .filters button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .filters input[type="search"] {
    flex: 1; min-width: 220px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    font: inherit;
    background: var(--paper);
  }
  .note {
    background: var(--accent-soft);
    border: 1px solid #d3dde8;
    padding: 12px 14px;
    margin: 8px 0 18px;
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 20px;
    align-items: start;
  }
  .epic {
    background: var(--paper);
    border: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .epic > summary, .task > summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 12px 14px;
  }
  .epic > summary::-webkit-details-marker,
  .task > summary::-webkit-details-marker { display: none; }
  .epic > summary { font-weight: 650; }
  .task { border-top: 1px solid var(--line); }
  .task > summary { font-weight: 500; padding-left: 22px; }
  .task.open-selected { background: #f7fafc; }
  .grow { flex: 1; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pkg {
    font-size: 11px;
    font-weight: 650;
    padding: 1px 6px;
    border: 1px solid var(--line);
    letter-spacing: .02em;
  }
  .pkg.I { color: var(--pkg1); border-color: #b7c9da; }
  .pkg.II { color: var(--pkg2); border-color: #b7d0c0; }
  .pkg.III { color: var(--pkg3); border-color: #e0cba3; }
  .body { padding: 0 16px 14px 22px; }
  .why { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  td.num { text-align: right; white-space: nowrap; width: 64px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px;
    position: sticky;
    top: 12px;
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .id { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .card h3 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .card p { margin: 0; }
  textarea {
    width: 100%;
    min-height: 280px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    border: 1px solid var(--line);
    padding: 10px;
    resize: vertical;
    background: #fafafa;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .primary {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  .ghost {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  .hidden { display: none !important; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  @media (max-width: 960px) {
    .layout, .stats { grid-template-columns: 1fr; }
    .card { position: static; }
  }
  @media print {
    .filters, .note, .primary, .ghost, header .lead { }
    .card { position: static; break-inside: avoid; }
    .epic { break-inside: avoid; }
    details { open: true; }
  }

  header .header-row {
    display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
  }
  header h1 { flex: 1; }
  .lang {
    display: inline-flex; border: 1px solid var(--line); flex-shrink: 0;
  }
  .lang button {
    border: 0; background: var(--paper); padding: 6px 12px;
    font: 12px/1.2 inherit; font-weight: 650; cursor: pointer; letter-spacing: .04em;
    color: var(--muted);
  }
  .lang button.active { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="header-row">
      <h1 id="ui-h1"></h1>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
    <p class="lead" id="ui-lead"></p>
  </div>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-tasks">—</b><span id="ui-stat-tasks"></span></div>
    <div class="stat"><b id="s-hours">—</b><span id="s-hours-label"></span></div>
    <div class="stat"><b id="s-days">—</b><span id="ui-stat-days"></span></div>
    <div class="stat"><b>130–150</b><span id="ui-stat-buffer"></span></div>
  </div>

  <div class="filters" id="pkg-filters">
    <button type="button" data-pkg="all" class="active" id="ui-pkg-all"></button>
    <button type="button" data-pkg="I" id="ui-pkg-I"></button>
    <button type="button" data-pkg="II" id="ui-pkg-II"></button>
    <button type="button" data-pkg="III" id="ui-pkg-III"></button>
  </div>
  <div class="filters" id="plat-filters">
    <button type="button" data-plat="both" class="active" id="ui-plat-both"></button>
    <button type="button" data-plat="pf" id="ui-plat-pf"></button>
    <button type="button" data-plat="mf" id="ui-plat-mf"></button>
    <input type="search" id="q">
  </div>
  <div class="note" id="ui-note"></div>

  <div class="layout">
    <div id="tree"></div>
    <aside class="card" id="card"></aside>
  </div>
  <footer id="ui-footer"></footer>
</div>
<script>

const EPICS_BY_LANG = {en: [{"id":"01","title":"Audit (in parallel with stage 02)","goal":"Capture the architecture, risks and coverage gaps without changing production. The work runs in parallel with stage 02 and is not a prerequisite for introducing PHPUnit. Interim findings refine the priority of stage 03 scenarios.","pfD":6.5,"mfD":2.5,"color":"gray","tasks":[{"id":"01.01","title":"Architecture map","pkg":"I","why":"A map of modules, integrations and environments, without which audit and tests proceed without a systematic basis.","done":"A document from which a new developer understands where the catalogue, cart, payment, administration and cron jobs live.","deps":"None. Starts together with 02.01.","role":"Senior Symfony","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Inventory of bundles, services, routes and commands","pf":2.0,"mf":0.5,"result":"bundle → responsibility table","desc":"Walk src/*Bundle, services.yml, routing and bin/console list. For each bundle, record responsibility, controllers and commands, and external dependencies. The output is the entry point to the audit and to test priorities."},{"title":"Map of external systems (payments, search, Mailchimp, Ads, PF↔MF)","pf":1.5,"mf":0.5,"result":"integration diagram","desc":"Collect all outbound HTTP/SOAP/SDK calls: PSP, Typesense/Algolia, Mailchimp, Google Ads, Make.com, the neighbouring storefront. For each: environments, secrets, and what happens if the service is down."},{"title":"Product / Purchase / User / Variation model","pf":1.5,"mf":0.5,"result":"simplified ER","desc":"Draw a simplified ER of the key entities and relationships (visibility, slug, prices, order addresses). Establish where catalogue changes affect the cart and payment."},{"title":"Environments and deployment (Docker, Pipelines, cache/logs)","pf":0.5,"mf":0.5,"result":"environment description","desc":"Describe local/dev/staging/prod: Docker, rsync Pipelines, where cache and logs are written (on PF they sit outside the repository). Record how we deploy and how we roll back."}]},{"id":"01.02","title":"Fragile zones and coupling","pkg":"I","why":"Explain why a change in one place breaks another.","done":"Top-20 risk files and a “change X → risk Y” map for the catalogue, prices, cart and statuses.","deps":"01.01","role":"Senior Symfony","pfH":8.5,"mfH":2.5,"subtasks":[{"title":"List of god classes (>1k lines)","pf":1.5,"mf":0.5,"result":"ProductController, CartController, cron commands","desc":"Find controllers and commands larger than ~1,000 lines. These are places where a “small change” breaks a neighbouring scenario. The top already includes ProductController, CartController, AddData*StaticPage, AppConstants."},{"title":"Hidden dependencies: statics, AppConstants, container","pf":2.0,"mf":0.5,"result":"list of couplings","desc":"Find AppConstants, static calls and $this->get()/container in controllers. Record which modules are coupled not through an explicit service but through global state."},{"title":"PF ↔ MF intersections (stock, images, API consumer)","pf":1.5,"mf":0.5,"result":"integration map","desc":"Describe the cron jobs and URLs by which the storefronts call each other (stock-by-sku, images, ApiConsumer). A change on one side can leave residue on the other."},{"title":"Map of change X → risk Y","pf":2.0,"mf":0.5,"result":"for catalogue/prices/cart/orders","desc":"Table: a price/visibility/order status/promo-code change → which pages, emails and cron jobs may break. This is the input to stage 03 test priorities."},{"title":"Duplicated business rules (Twig + PHP + JS + cron)","pf":1.5,"mf":0.5,"result":"list of duplicates","desc":"Find the same rule (product availability, discount, VAT) repeated in a template, controller, JS and a cron job. Such duplication is a typical source of regressions."}]},{"id":"01.03","title":"Dependencies and technical debt","pkg":"I","why":"Establish what blocks the upgrade and which CVEs already exist.","done":"Package table: version, latest, Symfony 4–7 blocker, CVE.","deps":"01.01","role":"Senior Symfony","pfH":5.5,"mfH":2.5,"subtasks":[{"title":"composer outdated + composer audit","pf":1.0,"mf":0.5,"result":"CVE list","desc":"Run composer outdated and composer audit. Table: package, current version, latest, CVE, whether it can be updated on PHP 7.4 / Symfony 3.4."},{"title":"Bundles without upstream (FOSUser, Assetic, Swiftmailer, JMS i18n)","pf":1.5,"mf":0.5,"result":"upgrade blockers","desc":"For each unmaintained bundle: what replaces it, at which Symfony step it is a blocker, whether it can remain until 5.4. FOSUser and JMS i18n are the principal schedule risks."},{"title":"JS debt: Inspinia, uglify, no front-end tests","pf":1.0,"mf":0.5,"result":"note","desc":"Record that the administration runs on jQuery/Inspinia, the build uses uglify, and Nightwatch is defunct. Do not propose rewriting the administration — only what we cover with Playwright."},{"title":"YAML versus annotation configuration, manual DI","pf":0.5,"mf":0.5,"result":"service map","desc":"Where services live in YAML, where in annotations, and where $this->get() is used. The map is needed so that DI is not broken during the upgrade and so that new code is written consistently."},{"title":"Report “what blocks Symfony 4/5/6/7”","pf":1.5,"mf":0.5,"result":"input to stage 08","desc":"Summary of blockers by major: SensioDistribution, Assetic, Swiftmailer, FOSUser, JMS i18n, Payum, PHP 8. This is the input to stage 08, not the start of the upgrade."}]},{"id":"01.04","title":"Why regressions occur","pkg":"I","why":"Link real defects to the absence of module boundaries and tests.","done":"1–2 pages of causes plus which types of test close each one.","deps":"01.02","role":"Senior Symfony","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Review of 5–8 recent “side-effect” defects","pf":2.0,"mf":0.5,"result":"review from git/tickets","desc":"Take real tickets/commits where change A broke B. For each: files, why a test did not catch it, which type of test would have closed the case."},{"title":"Module boundaries: Catalog→Cart, Cron→Product","pf":1.5,"mf":0.5,"result":"coupling diagram","desc":"Show direct calls between bundles without a façade service. Where Catalog writes into the cart and cron mutates Product — integration tests are required, not unit tests."},{"title":"Multilingual routing (JMS i18n, 10 domains)","pf":1.0,"mf":0.5,"result":"risk note","desc":"Describe how JMS i18n-routing splits URLs by en/fr/de/… hosts. A route change without sampling locales produces 404s on half of the domains."},{"title":"Administrative bulk commands without dry-run","pf":1.0,"mf":0.5,"result":"list of dangerous commands","desc":"List of commands that bulk-change prices, stock, visibility and translations. Note the absence of dry-run and tests — the risk of running them on production."}]},{"id":"01.05","title":"Inventory of current coverage","pkg":"I","why":"Record the actual state of coverage. The task does not block the start of 02.01.","done":"Flow table: test exists / none / defunct. PHPUnit suite green, or explicitly red with a reason.","deps":"None. Executed in parallel with stage 02.","role":"Middle+","pfH":2.5,"mfH":2.0,"subtasks":[{"title":"Run existing PHPUnit","pf":0.5,"mf":0.5,"result":"failure log","desc":"Run the suite as-is and keep the log. It is likely red or does not see src/*/Tests. Do not fix everything — record the fact for 02.01."},{"title":"Nightwatch inventory","pf":0.5,"mf":0.5,"result":"will not be revived","desc":"Describe the four obsolete scenarios and chromedriver 2.46. The decision is already taken: do not revive; replace with Playwright in 02.04."},{"title":"List of critical flows without tests","pf":1.0,"mf":0.5,"result":"input to stage 03","desc":"Checklist of storefront, cart, payment, login, administration, PF↔MF. For each: no test / defunct. This is the stage 03 backlog."},{"title":"Baseline coverage","pf":0.5,"mf":0.5,"result":"a figure of ~0% is acceptable","desc":"Capture the coverage percentage even if it is ~0. A “before” figure is needed so that an 80% line-coverage target is not later imposed without a baseline."}]},{"id":"01.06","title":"PHP/Symfony versions and obsolete code","pkg":"I","why":"Record the target: PHP 8.3 + Symfony 7.4 LTS, not 8.1.","done":"Compatibility report for PHP 8.1/8.2 and deprecated Symfony 3.4 APIs.","deps":"01.03","role":"Senior Symfony","pfH":5.0,"mfH":2.0,"subtasks":[{"title":"Compatibility with PHP 8.1/8.2","pf":2.0,"mf":0.5,"result":"list of failures","desc":"Run static analysis/Rector looking for each(), dynamic properties, string/int changes. The failure list is the input to 08.01, not a server upgrade."},{"title":"Deprecated Symfony 3.4 API","pf":1.5,"mf":0.5,"result":"list for Rector","desc":"Collect get(), templating, old security.yaml, EventDispatcher. This is the list for Rector on 4.4/5.4."},{"title":"Record the MySQL version in production and in Docker","pf":0.5,"mf":0.5,"result":"Docker = production","desc":"Capture SELECT VERSION() on production for both storefronts and align docker-compose with the actual version. A move to MySQL 8 is out of scope of this programme: Symfony 7 does not require it, and the speed gain is lower than eliminating N+1."},{"title":"Target-version recommendation","pf":1.0,"mf":0.5,"result":"PHP 8.3 + SF 7.4","desc":"Explicitly record the target: PHP 8.3 + Symfony 7.4 LTS through 2029. Symfony 8.1 is not adopted (PHP 8.4, short cycle)."}]},{"id":"01.07","title":"Security and Doctrine review","pkg":"I","why":"Find vulnerabilities before the fixes. Patches are stage 06.","done":"Findings with severity critical/high/medium, without patches.","deps":"01.01","role":"Senior + security-aware","pfH":8.5,"mfH":2.5,"subtasks":[{"title":"Encoder plaintext, roles, cron firewall","pf":1.5,"mf":0.5,"result":"auth findings","desc":"Review security.yml: plaintext encoder, ROLE_* hierarchy, whether /cron is open without a secret. Record findings; patches are stage 06."},{"title":"Secrets in git (gateway keys, webhooks)","pf":1.5,"mf":0.5,"result":"secrets inventory","desc":"Find TrueLayer pem/keys, Make.com webhooks, passwords in tests. Inventory: what is in git, what to rotate, without the values themselves in the report."},{"title":"Doctrine: native SQL, N+1, no migrations","pf":2.0,"mf":0.5,"result":"database risks","desc":"Find createNativeQuery/SQL concatenation, typical N+1, absence of Doctrine Migrations. The schema lives as-is — an upgrade and injection risk."},{"title":"XSS/CSRF in the administration, public cron URLs","pf":2.0,"mf":0.5,"result":"URL list","desc":"Check dangerous POST without CSRF, Twig output without escape, cron URLs reachable from the internet. List of URLs and severity."},{"title":"composer audit, old JWT packages","pf":1.5,"mf":0.5,"result":"CVE","desc":"Repeat the audit with a focus on web-token/jwt-*, miladrahimi/php-jwt, gree/jose. CVEs that close only with an upgrade — mark separately."}]},{"id":"01.08","title":"Performance review","pkg":"I","why":"Acceleration hypotheses. Optimisations are stage 07, after tests.","done":"Top slow pages and hypotheses with expected effect.","deps":"01.01","role":"Senior Symfony","pfH":5.5,"mfH":2.5,"subtasks":[{"title":"Top pages: catalogue, product page, checkout, admin lists","pf":1.5,"mf":0.5,"result":"URL list","desc":"Collect URLs that users and administrators open most often. These are candidates for measurement in 07.01, not optimisation now."},{"title":"Doctrine lazy versus extra queries","pf":1.5,"mf":0.5,"result":"N+1 candidates","desc":"On the product page and listing, estimate translations/visibilities/prices. Record N+1 hypotheses for stage 07."},{"title":"LiipImagine images, Assetic","pf":1.0,"mf":0.5,"result":"note","desc":"How presets and webp are generated, who minifies CSS/JS. Assetic is not to be developed — only understand the image bottleneck."},{"title":"Redis sessions, Typesense/Algolia","pf":1.0,"mf":0.5,"result":"note","desc":"Sessions in Redis already exist. Search and external calls: timeouts, what the user sees when the service is down. Degradation hypotheses."},{"title":"Acceleration hypotheses","pf":0.5,"mf":0.5,"result":"input to stage 07","desc":"A short list of “do X → expected effect”, without implementation. Priority for stage 07 after tests."}]},{"id":"01.09","title":"Final audit report","pkg":"I","why":"Consolidated report for the client. May refine estimates for stages 03–08; it does not stop work already started on stages 02 and 03.","done":"Report in Russian + 1-hour presentation. Estimates adjusted ±15%.","deps":"01.01–01.08","role":"Lead","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Single report: risks, priorities, what we do not touch","pf":2.5,"mf":1.0,"result":"PDF/MD for the client","desc":"Assemble 01.01–01.08 into a client document in Russian: risks, Packages I–III, what we will not rewrite."},{"title":"Refinement of the subsequent-stage backlog","pf":1.5,"mf":0.5,"result":"estimate update","desc":"After the facts, shift estimates B–H by ±15%, without rewriting the plan from scratch."},{"title":"Short presentation","pf":1.5,"mf":0.5,"result":"1 hour","desc":"One hour with the client/PM: three packages, the “tests → Symfony” order, decision on Package I."}]}]},{"id":"02","title":"Tooling, CI and first coverage","goal":"First stage of repository changes: working PHPUnit and storefront smoke tests (02.08) before PHPStan and Pipelines are complete. The master/develop deployment process is not changed.","pfD":6.5,"mfD":3.0,"color":"blue","tasks":[{"id":"02.01","title":"PHPUnit 9, test database, fixtures","pkg":"I","why":"The current phpunit.xml is designed for PHPUnit 4.1; the suite does not see src/*/Tests. Introduction of the test harness does not wait for the stage 01 report.","done":"Green phpunit --version, a separate test DB, 1 smoke test of the home page, instructions in Docker.","deps":"None. Does not depend on audit completion.","role":"Middle+","pfH":10.5,"mfH":4.0,"subtasks":[{"title":"PHPUnit 9 + phpunit-bridge (not 10+ until PHP 8.1)","pf":1.5,"mf":0.5,"result":"vendor/bin/phpunit","desc":"Install PHPUnit 9 — the ceiling for PHP 7.4. Update phpunit.xml.dist (currently schema 4.1), KERNEL_DIR, and the suite for tests/ and the required src/*/Tests."},{"title":"Separate test database, config_test without the dev profiler","pf":2.5,"mf":1.0,"result":"data isolation","desc":"config_test.yml must not import dev or hit the profiler. Its own dbname; tests must not write to dev/prod data."},{"title":"Fixtures: User, Country, Language, 1 product, 1 category","pf":3.0,"mf":1.0,"result":"Foundry/Fixtures","desc":"Minimal Foundry/DoctrineFixtures set: user, country, language, product with slug/visibility, category. Without this, functional tests are unstable."},{"title":"Base WebTestCase (client, login, locale host)","pf":1.5,"mf":0.5,"result":"uniform test style","desc":"One base class: createClient, login, locale host as in config_test. All functional tests inherit it; otherwise each author writes their own workaround."},{"title":"Repair the home-page smoke test","pf":1.0,"mf":0.5,"result":"CI anchor","desc":"The existing AppControllerTest must return 200 on /. This is the CI anchor: the pipeline is red if the application does not boot."},{"title":"Documentation for running in Docker","pf":1.0,"mf":0.5,"result":"Tests section","desc":"A section in docker/README: how to bring up the test DB and vendor/bin/phpunit. Without this, tests live with a single person."}]},{"id":"02.02","title":"PHPStan with baseline","pkg":"I","why":"Level 8 from scratch will halt work. First freeze the existing errors.","done":"composer phpstan, level 0, baseline in git, new errors fail CI.","deps":"02.01","role":"Middle+","pfH":5.0,"mfH":2.5,"subtasks":[{"title":"PHPStan 1.x + extension-installer","pf":1.0,"mf":0.5,"result":"package in require-dev","desc":"Install PHPStan 1.x for PHP 7.4 and the Symfony extension. PHPStan 2 — after PHP 8 in stage 08."},{"title":"phpstan.neon: src/, exclude Resources and vendored client","pf":1.0,"mf":0.5,"result":"config","desc":"Analyse src/, exclude Resources and the vendored Typesense client in SearchBundle. Otherwise the baseline inflates with template/client noise."},{"title":"Baseline of current errors","pf":1.5,"mf":0.5,"result":"phpstan-baseline.neon","desc":"Generate phpstan-baseline.neon for the current thousands of errors. Existing issues are frozen; new ones are caught. Do not repair 157k lines in this ticket."},{"title":"Level 0 as a mandatory CI check","pf":1.0,"mf":0.5,"result":"new errors do not pass","desc":"The build is rejected on errors beyond the baseline. Level 0 is the minimum useful threshold from the moment the check is enabled."},{"title":"composer phpstan script","pf":0.5,"mf":0.5,"result":"one command","desc":"composer phpstan runs the analysis with a single command locally and in the pipeline."}]},{"id":"02.03","title":"Rector dry-run","pkg":"I","why":"Establish safe rules. Do not commit a mass diff.","done":"Report: which rules are safe on Symfony 3.4.","deps":"02.01","role":"Senior","pfH":2.0,"mfH":1.0,"subtasks":[{"title":"Rector DeadCode/CodeQuality in dry-run","pf":1.0,"mf":0.5,"result":"diff report","desc":"Install Rector, run DeadCode and CodeQuality without writing files. Keep a report: what is safe, what changes behaviour."},{"title":"List of safe rules for 3.4","pf":1.0,"mf":0.5,"result":"input to 05.02","desc":"Record which rules may be applied on 3.4. Symfony 4.4+ sets are forbidden until stage 08. Do not commit a mass diff."}]},{"id":"02.04","title":"Playwright harness","pkg":"I","why":"Nightwatch + chromedriver 2.46 are defunct. One E2E smoke is required.","done":"Playwright in the CI image, page objects, home → product → cart scenario. Decision: smoke on PR, full suite nightly.","deps":"02.01","role":"Middle (JS/PHP)","pfH":7.5,"mfH":3.0,"subtasks":[{"title":"Playwright + Chromium in CI","pf":1.5,"mf":0.5,"result":"run in the pipeline","desc":"Nightwatch is not used. Playwright + Chromium in the pipeline image. A single run must be reproducible locally."},{"title":"Page objects: Home, Product, Cart, Login","pf":2.5,"mf":1.0,"result":"modules","desc":"Extract selectors into page objects; do not hard-code xpath in each test. Otherwise E2E will drift after a layout change."},{"title":"Smoke: home → product → add to cart","pf":1.5,"mf":0.5,"result":"1 green scenario","desc":"One end-to-end happy path on a fixture product. This is the Package I E2E anchor, not coverage of the entire storefront."},{"title":"Locale test hosts","pf":1.0,"mf":0.5,"result":"as in config_test","desc":"Hosts as in config_test (localhost, de.localhost…). Otherwise JMS i18n-routing will serve the wrong locale."},{"title":"PR versus nightly decision","pf":1.0,"mf":0.5,"result":"smoke on PR","desc":"Record: smoke on every PR, the full Playwright suite nightly. Otherwise CI will take an hour."}]},{"id":"02.05","title":"Bitbucket Pipelines on PR","pkg":"I","why":"Currently default = echo nothing. Checks are needed without changing rsync to production.","done":"PR: composer, phpunit, phpstan. develop/master: tests first, then the existing rsync. Blocking deployment on a red build is enabled in 04.01.","deps":"02.01, 02.02","role":"Middle+ / DevOps","pfH":10.0,"mfH":4.0,"subtasks":[{"title":"Docker image PHP 7.4 + MySQL + Redis in the pipeline","pf":3.0,"mf":1.0,"result":"services in yml","desc":"In Bitbucket services: PHP 7.4, MySQL, Redis. The default pipeline currently does nothing. Without this, phpunit in CI will not start."},{"title":"PR steps: composer, phpunit, phpstan","pf":2.5,"mf":1.0,"result":"default pipeline","desc":"On pull request: install, phpunit, phpstan baseline. Do not deploy from the default branch."},{"title":"Composer cache","pf":1.0,"mf":0.5,"result":"faster builds","desc":"Cache vendor/composer so that a PR does not install packages from scratch every time."},{"title":"Fail-fast, JUnit artefact","pf":1.0,"mf":0.5,"result":"report in BB","desc":"Fail on the first red suite; attach a JUnit report in Bitbucket so that the PM/developer can see what broke."},{"title":"develop/master: tests first, then rsync","pf":1.5,"mf":0.5,"result":"step order","desc":"Step order: tests, then the existing rsync. Do not rewrite rsync itself. Blocking deployment on a red build is enabled in 04.01 after stable C1 coverage."},{"title":"Payment test keys (stubs)","pf":1.0,"mf":0.5,"result":"secured variables","desc":"In secured variables — fake PSP keys, not production. Tests must not call live gateways."}]},{"id":"02.06","title":"Data isolation and HTTP mocks","pkg":"I","why":"Tests must not call production, PSP, Typesense or Make.com.","done":"Separate dbname, bootstrap guard, trimmed dump without PII, HTTP mocks.","deps":"02.01","role":"Middle+","pfH":6.5,"mfH":3.0,"subtasks":[{"title":"Forbid tests against the production database","pf":1.0,"mf":0.5,"result":"check in bootstrap","desc":"In bootstrap, check dbname/host. If production is hit by accident — exit. An incident in which tests wipe orders is unacceptable."},{"title":"Trimmed schema dump without PII","pf":2.5,"mf":1.0,"result":"fixture dump","desc":"Schema + a minimum of reference data, without customer emails/addresses. A reproducible dump is needed for CI and new developers."},{"title":"Mocks: payments, Typesense, Mailchimp, Make.com","pf":2.5,"mf":1.0,"result":"HTTP stubs","desc":"HTTP stubs for external APIs. Functional tests must not depend on the network or fire the Make.com webhook from the repository."},{"title":"Mail interception (disable_delivery)","pf":0.5,"mf":0.5,"result":"already partially present","desc":"Swiftmailer disable_delivery in test already exists — verify that mail does not leave the environment and can be read in a reset-password test."}]},{"id":"02.07","title":"Test templates for the team","pkg":"I","why":"A uniform style for unit, functional and browser tests.","done":"Three templates and an internal test-authoring standard in the repository.","deps":"02.01, 02.04","role":"Lead","pfH":4.0,"mfH":2.0,"subtasks":[{"title":"Service unit-test template","pf":1.0,"mf":0.5,"result":"example in tests/","desc":"Canonical unit test in tests/: mocks, naming, assertions. The team uses it as the specimen."},{"title":"Controller functional-test template","pf":1.0,"mf":0.5,"result":"example","desc":"Canonical pattern: login via the base class, fixture, request, status; do not inspect the full HTML without need."},{"title":"Playwright template","pf":1.0,"mf":0.5,"result":"example","desc":"Canonical smoke with a page object. Prohibit sleep(5000) as in the old Nightwatch — explicit waitFor."},{"title":"Internal test-authoring standard","pf":1.0,"mf":0.5,"result":"uniform style","desc":"Rule in the repository: new logic is accepted together with a test; style follows the approved templates. Tests with live credentials are forbidden."}]},{"id":"02.08","title":"First storefront coverage (slice of 03)","pkg":"I","why":"After PHPUnit is introduced, the repository must contain a test set that catches HTTP 500 errors on the storefront. Effort is moved from the start of 03.08 and the smoke scenarios of 03.01–03.04; it is not added to the overall volume.","done":"GET of home, category, product, /cart/, /login and 10–15 public routes do not return 500. Suite in CI as soon as 02.05 is ready.","deps":"02.01 and 02.06. PHPStan, Playwright and Pipelines are not blockers.","role":"Middle+","pfH":6.5,"mfH":2.5,"subtasks":[{"title":"GET of home, category, product (fixture product)","pf":2.5,"mf":1.0,"result":"200, not 500","desc":"Functional on fixtures: /, category, product page of an available item. Catches 500 after a Twig/route change. Subsequently 03.01 deepens filters and i18n; it does not duplicate these GETs."},{"title":"GET /cart/ and /login","pf":1.5,"mf":0.5,"result":"cart and login anchor","desc":"Smoke of cart and login without promo-code/registration scenarios. This is the Package I anchor while 03.02/03.04 are written alongside."},{"title":"10–15 public GETs from the router (start of 03.08)","pf":1.5,"mf":0.5,"result":"parameterised smoke","desc":"Parameterised test of a sample of public GETs: not 500. The full route list and admin smoke remain in 03.08."},{"title":"Include the set in CI after 02.05 is ready","pf":1.0,"mf":0.5,"result":"PR turns red on 500","desc":"Once phpunit exists in Pipelines, this set becomes mandatory. Completion of stage 02 is not required for this: storefront regression is pinned earlier."}]}]},{"id":"03","title":"Automated tests of critical flows","goal":"Regression of the storefront, cart, payment and administration blocks deployment. Start on the same day as green 02.01+02.06; a slice of smoke is already in 02.08.","pfD":18.0,"mfD":8.0,"color":"purple","tasks":[{"id":"03.01","title":"Catalogue, product page, search, i18n","pkg":"I","why":"A typical source of storefront regressions. GET of home, category and product is in 02.08; stage 03 covers filters, i18n and search.","done":"Functional: listing, product (on/off/no slug), locale sample, filters, mocked search. Playwright: category → product.","deps":"02.01 and 02.06. May run in parallel with 02.02–02.05 and 02.08.","role":"Middle+","pfH":20.5,"mfH":9.0,"subtasks":[{"title":"Category listing: 200, pagination, empty","pf":2.5,"mf":1.0,"result":"functional","desc":"Functional: a category with products returns 200 and pagination; an empty category is not 500 but an empty listing. Breaks when the repository/Twig is changed."},{"title":"Product page: available / disabled / deleted / no slug","pf":3.5,"mf":1.5,"result":"functional","desc":"Four product states: 200 if available in the locale; 404/redirect if disabled, deleted or without a slug. This is a frequent visibility side-effect defect."},{"title":"Multilingual URLs — a sample, not 10×N","pf":3.5,"mf":1.5,"result":"parameterised test","desc":"Parameterised test on 2–3 locales and 2–3 routes, not the Cartesian product of all domains. Catch that the JMS locale prefix does not produce a 404."},{"title":"Filters must not break SQL","pf":2.5,"mf":1.0,"result":"functional","desc":"Exercise a price filter and 1–2 attributes. Expectation: 200 and valid SQL, not a Doctrine exception on an empty/extreme range."},{"title":"Search: mock Typesense/Algolia + 1 functional","pf":2.5,"mf":1.0,"result":"without a live API","desc":"Mock the search client. One functional: the search page is not 500 and returns stubbed hits. A live cluster is not required in CI."},{"title":"Collections / outlet / sitemap 200","pf":2.0,"mf":1.0,"result":"smoke","desc":"Smoke GETs of collections, outlet and sitemap.xml. They often fail after a routing/PrestaSitemap change."},{"title":"Unit: Product::isAvailable(locale)","pf":2.0,"mf":1.0,"result":"unit","desc":"Unit test of availability by locale/flags isEnabled/isDeleted/visibility. The rule lives in the entity and is duplicated in Twig — the test is on the canonical source."},{"title":"Playwright: category → product","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: open a fixture category, click through to the product, title is visible. Verifies that the desktop template and links are alive."}]},{"id":"03.02","title":"Cart","pkg":"I","why":"CartController ~87 KB; any price/qty change hits checkout.","done":"Add/update/remove, guest→login merge, promo code, currency/country, unavailable product. Playwright through to the cart page.","deps":"03.01","role":"Senior / Middle+","pfH":17.5,"mfH":7.5,"subtasks":[{"title":"Add, qty, remove","pf":3.5,"mf":1.5,"result":"functional","desc":"Functional: add to cart, change quantity, remove a line. Cart in session/DB is consistent; no 500 on CartController."},{"title":"Guest → login, cart merge","pf":2.5,"mf":1.0,"result":"functional","desc":"A guest adds a product, then logs in — lines must neither disappear nor duplicate. A typical cart-merge defect."},{"title":"Promo code / credit / minimum amount","pf":2.5,"mf":1.0,"result":"functional","desc":"Three branches: valid promo code, user credit, rejection below the minimum amount. Do not call a real PSP."},{"title":"Recalculation on country/currency change","pf":2.5,"mf":1.0,"result":"functional","desc":"Changing country/currency in the cart recalculates shipping and the total; it must not leave the old price in the session."},{"title":"Unavailable product in the cart","pf":2.0,"mf":1.0,"result":"functional","desc":"The product was disabled after add: the cart shows an error/removal; checkout must not create an order with a ghost item."},{"title":"Unit of totals calculation (if it can be extracted)","pf":2.5,"mf":1.0,"result":"unit/service","desc":"If totals still live in the controller — write a test on the current path; preferably extract a service (this is also a 05.03 candidate) and cover it with a unit test."},{"title":"Playwright: add to cart → cart","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: add button, navigate to the cart, product line is visible. Without payment."}]},{"id":"03.03","title":"Checkout and payments","pkg":"I","why":"Money. Real PSPs are not invoked in tests — fake Payum + fixture notify.","done":"Purchase creation, idempotency, fake capture, 1 webhook happy+fail for each live gateway. Remaining gateways may be deferred as Package II follow-up, without removing the happy path from C1.","deps":"03.02, 02.06","role":"Senior","pfH":28.5,"mfH":11.5,"subtasks":[{"title":"Checkout: address, shipping, Purchase","pf":5.0,"mf":2.0,"result":"functional C1","desc":"Functional C1: fill the address, select shipping, create a Purchase in the test DB. The money anchor before the gateway."},{"title":"Idempotency of a repeated submit","pf":2.0,"mf":1.0,"result":"not two orders","desc":"A double submit must not create two orders. F5/repeated POST is a frequent checkout defect."},{"title":"Fake capture → paid status","pf":4.0,"mf":1.5,"result":"C1","desc":"Payum gateway stub: capture succeeds, Purchase status = paid. Real Stripe/Hipay is not invoked in CI."},{"title":"Notify of each live gateway: happy + fail","pf":8.5,"mf":3.0,"result":"may be split by PSP","desc":"For each PSP in payment_methods.yml: a valid notify moves the status, an invalid one does not. May be split by gateway as follow-ups, but the C1 happy path is mandatory."},{"title":"Hipay chargeback without real money","pf":2.0,"mf":1.0,"result":"C2 is acceptable","desc":"Exercise the chargeback/status branch on a Hipay fixture. May sit in wave C2, but must not be forgotten — finance depends on it."},{"title":"3DS redirect (mock)","pf":2.0,"mf":1.0,"result":"not 500","desc":"3DS mock: the controller redirects, does not return 500. Without a real bank."},{"title":"Payment failure must not decrement stock twice","pf":3.0,"mf":1.0,"result":"stock regression","desc":"A failed capture must not decrement stock again or leave the order as “paid”. Regression of money and warehouse."},{"title":"Playwright up to the “pay” button","pf":2.0,"mf":1.0,"result":"without a real PSP","desc":"E2E up to the payment screen, without clicking into a live PSP. Catches breakage of checkout steps and JS."}]},{"id":"03.04","title":"Registration, login, account","pkg":"I","why":"The old test contains hard-coded credentials — a specimen of what not to do.","done":"Registration, login/logout, reset password via mail interception, profile, orders/return, wishlist. Playwright: login → /account.","deps":"02.01 and 02.06. Login smoke is included in 02.08.","role":"Middle+","pfH":14.0,"mfH":6.0,"subtasks":[{"title":"Registration + validations + GDPR","pf":2.5,"mf":1.0,"result":"functional, fixtures","desc":"Registration form on fixtures, not live emails. Terms/GDPR, email uniqueness, redirect to the account. The old test with test11111@ is a specimen of what not to do."},{"title":"Login / logout / wrong password","pf":2.0,"mf":1.0,"result":"functional","desc":"Successful login, logout, password error without leaking that the account exists beyond the standard message."},{"title":"Reset password (mail intercepted)","pf":2.0,"mf":1.0,"result":"functional","desc":"Mail does not leave the environment (disable_delivery); extract the token from it; the password changes; the old one no longer works."},{"title":"Account: profile, addresses","pf":2.0,"mf":1.0,"result":"functional","desc":"GET/POST of profile and addresses as a logged-in user. 200, persistence, not another user’s data."},{"title":"Orders and return","pf":2.5,"mf":1.0,"result":"functional","desc":"Order list of the fixture user, view, restitution/return scenario if it is live in production."},{"title":"Wishlist","pf":1.5,"mf":0.5,"result":"functional","desc":"Add/remove wish. Not 500; the product is in the list after reload."},{"title":"Playwright: login + /account","pf":1.5,"mf":0.5,"result":"E2E","desc":"E2E login as a test user and opening /account. Verification of the desktop account template."}]},{"id":"03.05","title":"Administration: products, prices, orders","pkg":"II","why":"ProductController ~113 KB is the principal source of side-effect defects.","done":"RBAC per security.yml, save product (price/visibility/slug), 1 bulk price, order-status change, smoke lists. Playwright: admin → product card.","deps":"03.04, 02.01","role":"Senior / Middle+","pfH":19.0,"mfH":8.0,"subtasks":[{"title":"RBAC: ROLE_* must not see others’ sections","pf":2.5,"mf":1.0,"result":"functional","desc":"Per security.yml: an accountant must not see products, an integrator must not see payments. Functional tests with different roles, not a single SUPER_ADMIN for all tests."},{"title":"Product create/edit","pf":4.5,"mf":1.5,"result":"price, visibility, slug","desc":"Save a product: price, visibility, slug. After save, the storefront product page is in the expected state. ProductController is the principal risk."},{"title":"Bulk prices / countries — at least 1 command","pf":2.5,"mf":1.0,"result":"command test","desc":"Test of one administrative bulk-price command (dry-run if present, otherwise on a fixture). Do not run every Update*Command."},{"title":"Order-status change + emails (mock)","pf":3.5,"mf":1.5,"result":"functional","desc":"Change Purchase status in the administration; mail goes to the interceptor; side fields (warehouse/payment) remain consistent."},{"title":"Order list: filters must not fail","pf":2.0,"mf":1.0,"result":"smoke","desc":"Admin list with 2–3 filters: 200, not timeout/500 on an empty selection."},{"title":"Designers / categories — GET 200 after login","pf":2.0,"mf":1.0,"result":"smoke","desc":"Smoke of key admin GETs after login as ROLE_ADMIN_INTEGRATION. We do not cover all of Inspinia."},{"title":"Playwright: admin login → product","pf":2.0,"mf":1.0,"result":"E2E","desc":"E2E: administrator logs in, opens a product card in the administration. Extract Inspinia selectors into a page object."}]},{"id":"03.06","title":"Cron jobs and the PF ↔ MF link","pkg":"II","why":"CronBundle ~41k lines. Cover only what runs in production.","done":"Inventory of production cron, tests of 5–8 dangerous commands, mocked stock-by-sku, feeds do not fail, cron is not public without a secret.","deps":"02.06, 03.01","role":"Senior","pfH":14.0,"mfH":6.0,"subtasks":[{"title":"Inventory of commands that run in production cron","pf":2.0,"mf":1.0,"result":"list from infrastructure","desc":"Capture crontab/the list from infrastructure, not all 120 Command.php files. We test only what actually runs."},{"title":"Tests of 5–8 dangerous commands (stock, prices, deactivation, rating)","pf":5.5,"mf":2.0,"result":"command tests","desc":"Command tests on fixtures: stock update, price, deactivation with errors, rating emails. Without running 500 KB of static-page commands."},{"title":"HTTP API consumer / stock-by-sku (neighbour mock)","pf":2.5,"mf":1.0,"result":"functional","desc":"ApiConsumer and stock endpoints: mock the neighbouring storefront. Verify response parsing and stock write, not a live curl to myfaktory.com."},{"title":"FeedController feeds on a fixture","pf":2.0,"mf":1.0,"result":"not 500","desc":"Key feeds (Google/partners) must not fail on a small fixture. Do not compare a giant XML with production."},{"title":"Without a secret/role, cron is not public","pf":2.0,"mf":1.0,"result":"security test","desc":"A request to /cron/* without a token/role — 401/403. Part of the URLs may currently be open — this is both a security test and a fix in 06.02."}]},{"id":"03.07","title":"Shipping, mail, rating, media","pkg":"II","why":"Secondary to money, but it breaks UX and order emails.","done":"Shipping calculation for 2–3 countries, order/registration/reset emails, rating if live, media without a real ImageMagick in CI.","deps":"03.02, 03.04","role":"Middle+","pfH":9.0,"mfH":4.0,"subtasks":[{"title":"Shipping calculation for 2–3 countries","pf":2.5,"mf":1.0,"result":"unit/functional","desc":"Unit/functional: shipping for 2–3 countries from the real matrix. Not every world zone. Catch ShippingBundle regression."},{"title":"Emails: order, registration, reset","pf":2.5,"mf":1.0,"result":"Twig + disable_delivery","desc":"Three templates render; disable_delivery; the body contains the order number/reset link. Catch broken Twig after a MailBundle change."},{"title":"Rating: request and moderation","pf":2.0,"mf":1.0,"result":"if active in production","desc":"If rating is live in production: review request and moderation in the administration. If disabled — skip explicitly in the ticket; do not spend hours."},{"title":"Image upload/alt, ImageMagick mock","pf":2.0,"mf":1.0,"result":"without the binary in CI","desc":"Do not install ImageMagick in CI for a single test. Mock the converter; verify that the command/controller does not fail on a fixture file."}]},{"id":"03.08","title":"Smoke GET of all important pages","pkg":"I","why":"Complete the route list, administration smoke and a sample of mobile templates. 10–15 public GETs are already in 02.08.","done":"Remaining public GETs: 200/302, not 500. Admin smoke under SUPER_ADMIN. Sample of mobile templates. Without duplicating 02.08.","deps":"02.08. Previously covered GET routes are not duplicated.","role":"Middle","pfH":7.5,"mfH":3.5,"subtasks":[{"title":"Complete the list of public routes (excluding those already covered in 02.08)","pf":1.0,"mf":0.5,"result":"list minus C0","desc":"Export GETs from the router, subtract home/category/product/cart/login and the 10–15 already in 02.08. Do not duplicate the parameterisation."},{"title":"Parameterised test of remaining GETs: 200/302, not 500","pf":2.0,"mf":1.0,"result":"C1 public","desc":"On the remaining list: not 500. 301/302 are acceptable (i18n/www)."},{"title":"Admin smoke of key GETs","pf":2.5,"mf":1.0,"result":"C2 is acceptable","desc":"Under SUPER_ADMIN, check 10–15 principal admin GETs. If needed, this moves to wave C2 without changing the C1 composition."},{"title":"Mobile templates — user-agent sample","pf":2.0,"mf":1.0,"result":"not all pages","desc":"Separate mobile Twig: 3–5 URLs with a mobile UA. Do not duplicate every desktop case."}]},{"id":"03.09","title":"Front-end of critical JS","pkg":"II","why":"Search and the mini-cart live on JS. Jest is not stood up for the whole of Inspinia.","done":"Playwright: search, ajax add, checkout JS validation if present.","deps":"02.04, 03.01, 03.02","role":"Middle (JS)","pfH":7.0,"mfH":3.0,"subtasks":[{"title":"Playwright: Typesense search desktop/mobile","pf":2.5,"mf":1.0,"result":"E2E","desc":"Live search JS: type a query, suggestions/results are visible on the desktop and mobile template. The API may be mocked at the network layer."},{"title":"Mini-cart / ajax add","pf":2.5,"mf":1.0,"result":"E2E","desc":"Ajax add without reload; the mini-cart updates. Catch cart JS breakage that PHPUnit cannot see."},{"title":"Checkout JS validation","pf":2.0,"mf":1.0,"result":"if present in production","desc":"If production has JS validation of steps — exercise an empty-field error. No JS — close the subtask with a note; do not write a dead test."}]},{"id":"03.10","title":"Suite stabilisation","pkg":"II","why":"Flaky tests will destroy trust in CI. Target: PHPUnit < 15 min, flaky < 2%.","done":"Hello World stubs removed. The C1 set is stable for 5 working days. Coverage report by bundle — for the client, not a merge criterion.","deps":"03.01–03.09","role":"Lead + Middle","pfH":7.5,"mfH":3.5,"subtasks":[{"title":"Clean out flaky cases (sessions, processes, time zones)","pf":2.5,"mf":1.0,"result":"stable run","desc":"Remove runInSeparateProcess where it is not needed, pin TZ/locale, do not depend on “live” 20 products from the DB as in the old CatalogBundleTest."},{"title":"Parallelism, if CI allows","pf":1.5,"mf":0.5,"result":"run time","desc":"Enable parallel phpunit only if there is no shared DB race. Otherwise leave sequential; do not breed flaky tests."},{"title":"Target unit+functional < 15 min on PR","pf":2.0,"mf":1.0,"result":"metric","desc":"Measure time, cut superfluous kernel boots, do not load 20 product pages in one test. Nobody runs a long suite."},{"title":"Remove dead DefaultControllerTest","pf":0.5,"mf":0.5,"result":"no Hello World","desc":"Hello World and assertContains('200') in content — delete. They are red or meaningless and discredit CI."},{"title":"Coverage report by bundle","pf":1.0,"mf":0.5,"result":"for the client","desc":"Clover/HTML report by bundle for the client. The coverage percentage is not a merge condition. The readiness criterion is a stable C1 set, not 80% of lines."}]}]},{"id":"04","title":"Quality policy","goal":"New code is not merged without checks. Tests are routine.","pfD":1.5,"mfD":1.0,"color":"green","tasks":[{"id":"04.01","title":"Mandatory CI on pull request","pkg":"I","why":"Otherwise nobody examines a green suite.","done":"Merge to develop/master only with a green pipeline. Document “what to do if CI is red”. On master — after stable C1.","deps":"02.05, 03.10 (C1 is stable)","role":"Lead / DevOps","pfH":4.0,"mfH":2.0,"subtasks":[{"title":"Branch permissions: green pipeline","pf":1.0,"mf":0.5,"result":"Bitbucket","desc":"In Bitbucket: merge to develop/master only with a successful build. Without this the suite is decorative."},{"title":"Required steps: PHPUnit C1, PHPStan","pf":1.0,"mf":0.5,"result":"required checks","desc":"Required checks: phpunit C1 and phpstan baseline. The rest (full Playwright) — per the 02.04 decision."},{"title":"Playwright smoke: PR or nightly","pf":1.0,"mf":0.5,"result":"from 02.04","desc":"Enable the option chosen in 02.04. Do not leave the decision as “later” — otherwise E2E will die again."},{"title":"Document: CI is red — what to do","pf":1.0,"mf":0.5,"result":"for the team","desc":"Short procedure: analyse the JUnit report; merging is forbidden until the cause is removed. Re-running the build without analysis is not permitted."}]},{"id":"04.02","title":"Coverage rule for new code","pkg":"I","why":"We do not chase a coverage percentage. We require a test for changed behaviour.","done":"Definition of Done in the PR template. Exceptions: xlf, content Twig. Acceptance rule: a task without a test is not closed.","deps":"04.01, 02.07","role":"Lead","pfH":3.5,"mfH":2.0,"subtasks":[{"title":"DoD: bug/feature = a test that would have failed without the fix","pf":1.0,"mf":0.5,"result":"DoD text","desc":"Definition of Done text: the task is accompanied by a test that is red on the old code. Not “cover the file to 80%.”"},{"title":"PR checklist (Bitbucket template)","pf":1.0,"mf":0.5,"result":"template","desc":"PR template: what changed, how to verify, which test was added. Exceptions — in the next item."},{"title":"Exceptions: translations, content Twig","pf":0.5,"mf":0.5,"result":"in the template","desc":"Explicitly allow without a test: xlf, copy in static Twig without logic. Otherwise the process will not be adopted."},{"title":"Acceptance rule: no test — the task is not closed","pf":1.0,"mf":0.5,"result":"repository standard","desc":"Record in the team standard: a task is not accepted without a test (except the 04.02 exceptions)."}]},{"id":"04.03","title":"TDD for new business logic","pkg":"I","why":"TDD on 500 KB commands is not realistic. On new code and extracted services — yes.","done":"Guide red→green→refactor + 2 training examples on a live small ticket.","deps":"04.02","role":"Lead","pfH":4.0,"mfH":2.0,"subtasks":[{"title":"Short internal TDD guide","pf":1.0,"mf":0.5,"result":"1–2 pages","desc":"1–2 pages: red → green → refactor. Only new code and extracted services, not 500 KB commands."},{"title":"2 training examples on a live ticket","pf":2.5,"mf":1.0,"result":"pairing/demo","desc":"Walk two small real tickets in TDD with the team so that the guide does not remain a file in docs."},{"title":"Production hotfix: test in the same PR","pf":0.5,"mf":0.5,"result":"exception in the guide","desc":"Exception: a production fix may go first, but the test is in the same PR before merge to develop. Not “tests later, never”."}]},{"id":"04.04","title":"Features separate from upgrade branches","pkg":"I","why":"Mixing a shop feature and Rector produces an unresolvable conflict.","done":"Branch rule feature/* vs upgrade/sfXX. In estimates for new features +20–40% for tests.","deps":"04.01","role":"PM + Lead","pfH":1.5,"mfH":1.5,"subtasks":[{"title":"A feature is not in the same PR as Rector/upgrade","pf":0.5,"mf":0.5,"result":"rule","desc":"Prohibit mixing a shop feature and a mass Rector/SF upgrade. Otherwise an unresolvable conflict and a rollback of everything."},{"title":"Branches feature/*, test/*, upgrade/sfXX","pf":0.5,"mf":0.5,"result":"convention","desc":"Branch names: features separately, upgrade only upgrade/sf44 and similar. The PM can see from the name that they must not be released together."},{"title":"Test overhead +20–40% in the feature estimate","pf":0.5,"mf":0.5,"result":"for the PM","desc":"Include +20–40% for tests in estimates for new features. Otherwise Package I will be consumed by “quick” tasks without coverage."}]}]},{"id":"05","title":"PHPStan, Rector and targeted debt","goal":"Catch errors before runtime. Split god classes only under tests.","pfD":6.0,"mfD":2.0,"color":"yellow","tasks":[{"id":"05.01","title":"PHPStan: raising the level","pkg":"II","why":"The baseline is frozen. Now we repair real defects and raise the level.","done":"Level 1–2 in CI. Level 8 is not the target. Two further raises are included in the stage estimate.","deps":"02.02, 04.01","role":"Middle+","pfH":17.0,"mfH":6.0,"subtasks":[{"title":"Baseline review: error clusters","pf":2.0,"mf":0.5,"result":"grouping","desc":"Group the thousands of PHPStan errors: undefined, types, dead. Repair by cluster, not by random files."},{"title":"Level 1–2: repairs of real defects","pf":3.0,"mf":1.0,"result":"not cosmetics","desc":"Raise the level to 1–2, repairing real defects (call of a non-existent method), not naming cosmetics."},{"title":"Ignore Resources and vendored Typesense","pf":0.5,"mf":0.5,"result":"neon","desc":"Do not pull twig/xlf and a third-party client into the analysis. Otherwise the level will never be raised."},{"title":"Fresh baseline, CI on the new level","pf":1.5,"mf":0.5,"result":"gate","desc":"After the clean-up — a new baseline and a gate at this level. Lowering the level without cause is forbidden."},{"title":"Two further level raises (stage reserve)","pf":10.0,"mf":3.5,"result":"+5/+3 days in the plan","desc":"The next two level steps within the 8/5 days of the stage, not level 8. Each raise is a separate PR."}]},{"id":"05.02","title":"Rector: safe sets","pkg":"II","why":"Mass Rector in a single PR will break production. Per bundle, each set is a PR.","done":"DeadCode and CodeQuality applied. Symfony Rector sets — only in stage 08.","deps":"02.03, 03 C1 green","role":"Senior","pfH":8.0,"mfH":3.0,"subtasks":[{"title":"DeadCode per bundle, 1 bundle = 1 PR","pf":3.0,"mf":1.0,"result":"series of PRs","desc":"Rector DeadCode one bundle at a time, each PR green on the suite. A single giant diff cannot be reviewed."},{"title":"CodeQuality without behaviour change","pf":2.5,"mf":1.0,"result":"PR","desc":"Quality rules that do not change business logic. Before merge — phpunit. Behavioural sets — in 08."},{"title":"Forbid dangerous rules until the PHP upgrade","pf":1.0,"mf":0.5,"result":"rector.php","desc":"In rector.php forbid PHP 8 attributes, rename methods, Symfony 4+ sets. Otherwise we will break 3.4."},{"title":"PHPUnit + smoke after each PR","pf":1.5,"mf":0.5,"result":"green CI","desc":"Rector merge checklist: phpunit C1 and Playwright smoke. Red — revert, not “we will fix it in the next commit”."}]},{"id":"05.03","title":"Extract 5 services from god classes","pkg":"II","why":"Not “split everything”. Only what is already covered by tests and is an operational hindrance.","done":"5 services (cart totals, order status, available, price by country, +1 from the audit). Static-page commands of 500 KB are not touched.","deps":"01.02, 03.02, 03.05, 04.03","role":"Senior","pfH":20.0,"mfH":8.0,"subtasks":[{"title":"Select 5 targets from the 01.02 risk map","pf":1.0,"mf":0.5,"result":"list","desc":"Choose 5 fragments from god classes already covered by tests: cart totals, order status, isAvailable, price by country, +1 from the audit."},{"title":"TDD: service 1","pf":4.0,"mf":1.5,"result":"extracted + tests","desc":"Extract the first service via TDD: first a test of current behaviour, then the class, controller kept thin. Candidate: cart totals calculation."},{"title":"TDD: service 2","pf":4.0,"mf":1.5,"result":"extracted + tests","desc":"Second service. Candidate: order-status change (emails mocked)."},{"title":"TDD: service 3","pf":4.0,"mf":1.5,"result":"extracted + tests","desc":"Third service. Candidate: product availability by locale, to remove the Twig/PHP duplicate."},{"title":"TDD: service 4","pf":3.5,"mf":1.5,"result":"extracted + tests","desc":"Fourth service. Candidate: price by country."},{"title":"TDD: service 5","pf":3.5,"mf":1.5,"result":"extracted + tests","desc":"Fifth service — from the 01.02 top, not static-page commands of 500 KB (content, not logic)."}]},{"id":"05.04","title":"DI conventions for new code","pkg":"II","why":"We do not migrate 125 files with get() in one step.","done":"New code — constructor injection. Document “how to register a service”.","deps":"04.02","role":"Lead","pfH":2.0,"mfH":1.0,"subtasks":[{"title":"Rule: new code without $this->get()","pf":1.0,"mf":0.5,"result":"PR checklist","desc":"New classes — constructor injection. A mass migration of the 125 existing files that use the container is not performed."},{"title":"Service-registration document","pf":1.0,"mf":0.5,"result":"internal guide","desc":"How to add a service in YAML/autowire on the current 3.4. So that another $this->get('pf.xxx') is not introduced."}]}]},{"id":"06","title":"Security — fixes","goal":"Close critical/high findings from the audit. Each fix is a separate PR onto develop.","pfD":5.0,"mfD":2.0,"color":"orange","tasks":[{"id":"06.01","title":"Secrets out of git and rotation","pkg":"II","why":"TrueLayer keys and a webhook URL already sit in the repository.","done":"Secrets in env/parameters, .gitignore + CI check. PSP rotation agreed with the client (calendar risk of dashboards).","deps":"01.07","role":"Senior + infrastructure","pfH":7.0,"mfH":2.5,"subtasks":[{"title":"Inventory of secrets in git","pf":1.5,"mf":0.5,"result":"list","desc":"Full list: TrueLayer pem, webhook URL, test passwords, keys in parameters.dist. Do not paste secrets into the ticket/report in full."},{"title":"Move into parameters/env","pf":2.5,"mf":1.0,"result":"code without keys","desc":"Keys only in parameters.yml / env, not in src/. Code reads parameters. Production values are set by infrastructure, not by commit."},{"title":".gitignore + CI patterns","pf":1.5,"mf":0.5,"result":"do not bring them back","desc":"Ignore keys and a simple CI check for *.pem / AWS_SECRET in src. So that secrets do not return in the next PR."},{"title":"Agree PSP-key rotation","pf":1.5,"mf":0.5,"result":"client/dashboards","desc":"With the client: rotation of keys that have already leaked into git. Calendar risk of Hipay/Stripe/TrueLayer dashboards — not code alone."}]},{"id":"06.02","title":"Auth, ACL, cron, CSRF","pkg":"II","why":"plaintext encoder in security.yml; cron may be public.","done":"No plaintext. Firewall for /cron and API. CSRF on dangerous POST. IDOR: another user’s order by id is inaccessible.","deps":"01.07, 03.04","role":"Senior","pfH":8.5,"mfH":3.5,"subtasks":[{"title":"Remove the plaintext encoder","pf":1.5,"mf":0.5,"result":"security.yml","desc":"In security.yml encoder Symfony User: plaintext — remove. This is a critical audit finding. Verify that nobody logs in through this provider."},{"title":"Audit firewall /cron, API, admin","pf":2.5,"mf":1.0,"result":"closed URLs","desc":"Close /cron and API with a firewall (secret/role/IP). Reconcile admin access_control with the actual URLs."},{"title":"CSRF on dangerous admin POST","pf":1.5,"mf":0.5,"result":"fixes + tests","desc":"Forms for status change, prices, deletion — CSRF. Test: POST without a token does not succeed."},{"title":"IDOR in the account (another user’s order)","pf":2.5,"mf":1.0,"result":"test + fix","desc":"User A must not open order B by id in the URL. Test of two fixture users + controller fix."},{"title":"Captcha enabled in production","pf":0.5,"mf":0.5,"result":"config check","desc":"Verify that recaptcha/gregwar are not disabled in prod (in test — acceptable). Registration-spam regression."}]},{"id":"06.03","title":"Doctrine / SQL / PII","pkg":"II","why":"There are no migrations; native SQL exists.","done":"SQL concatenations reviewed. PII not in logs or fixtures. Doctrine Migrations — in 08.01, not here.","deps":"01.07","role":"Senior","pfH":6.5,"mfH":2.5,"subtasks":[{"title":"Search for SQL concatenation versus parameters","pf":2.5,"mf":1.0,"result":"fixes + tests","desc":"Find SQL strings that concatenate user input; convert them to parameters. Test with dangerous input."},{"title":"Dangerous createNativeQuery / DBAL","pf":1.5,"mf":0.5,"result":"review","desc":"Review native SQL: no dynamic fragments. Native SQL is not forbidden; unsafe assembly is."},{"title":"Checklist of PHP database-user privileges","pf":1.0,"mf":0.5,"result":"infrastructure","desc":"The production PHP user is not root, without DROP/FILE unless required. An infrastructure checklist; code change is not necessarily required."},{"title":"PII in logs and fixtures","pf":1.5,"mf":0.5,"result":"clean out","desc":"Remove emails/telephones/addresses from logs and test fixtures. Delete the old UserControllerTest with a real mailbox."}]},{"id":"06.04","title":"Composer audit and patches without changing Symfony","pkg":"II","why":"composer.json has audit.block-insecure: false.","done":"Audit in CI as a report. Packages that can be updated without a Symfony major are updated. block-insecure: true — after wave H.","deps":"01.03","role":"Middle+","pfH":6.0,"mfH":3.0,"subtasks":[{"title":"Audit in CI (report, not block)","pf":1.0,"mf":0.5,"result":"pipeline","desc":"composer audit in the pipeline as a warning/report. block-insecure remains false for now — otherwise we stop on CVEs that are fixed only by an SF upgrade."},{"title":"Update packages without changing the Symfony major","pf":3.5,"mf":1.5,"result":"PR","desc":"Patch/minor of packages compatible with 3.4/PHP 7.4. Do not touch symfony/symfony 3.4.47 in this ticket."},{"title":"Record packages waiting for PHP 8","pf":1.0,"mf":0.5,"result":"list","desc":"List “we will update in 08.xx”. So that days are not spent on an impossible update now."},{"title":"Note: block-insecure after 08","pf":0.5,"mf":0.5,"result":"reminder ticket","desc":"Reminder ticket: after 7.4 enable block-insecure true. Must not be forgotten, otherwise audit is again decorative."}]},{"id":"06.05","title":"Sessions, file upload, headers","pkg":"II","why":"cookie_secure is already true; reconcile the rest with nginx.","done":"Session flags, admin upload check, debug bundles only on local/dev.","deps":"01.07","role":"Middle+","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"Session Redis, cookie flags","pf":1.5,"mf":0.5,"result":"reconciliation","desc":"Reconcile cookie_secure, httponly, samesite with nginx. Redis sessions must not be lost on test/dev."},{"title":"File upload: types and path","pf":1.5,"mf":0.5,"result":"fixes","desc":"Admin/media: type whitelist, path outside the web root if possible, size limit. Test of a php file presented as an image."},{"title":"Headers (partly on nginx)","pf":1.5,"mf":0.5,"result":"checklist","desc":"Checklist of X-Frame-Options/CSP/HSTS: what is already on nginx, what is not. Do not duplicate blindly in PHP."},{"title":"Debug bundles not in production","pf":1.0,"mf":0.5,"result":"AppKernel","desc":"AppKernel: Debug/WebProfiler/Generator only on local/dev/test. They must not be present in production."}]},{"id":"06.06","title":"Payment notify signatures","pkg":"II","why":"A forged webhook = another user’s order marked “paid”.","done":"Signature check for each live gateway + test. Notify idempotency. Do not log PAN/tokens.","deps":"03.03, 01.07","role":"Senior","pfH":7.0,"mfH":3.0,"subtasks":[{"title":"Signature of each live gateway (code + test)","pf":4.0,"mf":1.5,"result":"notify cannot be forged","desc":"Notify without a valid signature must not change status. Test of a forged payload. Otherwise anyone can “pay” an order."},{"title":"Notify idempotency","pf":2.0,"mf":1.0,"result":"a repeat must not move status twice","desc":"A repeat of the same notify must not move status twice or send two emails. A typical PSP-retry defect."},{"title":"Do not log PAN/tokens","pf":1.0,"mf":0.5,"result":"log review","desc":"Review of Payum/controller logs: no card numbers, no raw tokens. Mask or remove."}]}]},{"id":"07","title":"Performance","goal":"Speed up the storefront and admin lists after tests: N+1, indexes, cache. A MySQL version change is out of scope.","pfD":4.5,"mfD":1.5,"color":"pink","tasks":[{"id":"07.01","title":"Profiling","pkg":"II","why":"Without figures, optimisation is guesswork.","done":"Blackfire or profiler on a data copy without PII. Top-10 URLs + admin lists. Baseline in the report.","deps":"03 C1","role":"Senior","pfH":6.0,"mfH":2.5,"subtasks":[{"title":"Configure the profiler on a development copy","pf":2.5,"mf":1.0,"result":"Blackfire/profiler","desc":"Blackfire or Symfony profiler on a data copy without PII. Do not profile production first."},{"title":"Top-10 URLs: TTFB, Doctrine, memory","pf":1.5,"mf":0.5,"result":"table","desc":"Measure 10 URLs from 01.08: TTFB, Doctrine query count, memory. This is the “before” baseline."},{"title":"Administration: product and order lists","pf":1.0,"mf":0.5,"result":"measurement","desc":"Separate measurement of the two heaviest admin lists. Often worse than the storefront."},{"title":"Record the baseline","pf":1.0,"mf":0.5,"result":"report","desc":"Table of figures in the report. Without it, stage 07 cannot be closed as “it feels faster”."}]},{"id":"07.02","title":"Doctrine: N+1 and indexes","pkg":"II","why":"N+1 on the product page (translations/visibilities) has a measurable effect. A database major-version change is out of scope.","done":"N+1 eliminated on the product page and listing. Indexes from the slow query log. Admin reports without hydrating every entity.","deps":"07.01, 03.01","role":"Senior","pfH":7.0,"mfH":2.5,"subtasks":[{"title":"N+1 on the product page and listing","pf":3.0,"mf":1.0,"result":"fixes + tests","desc":"Close extra queries for translations/visibilities/prices. Test or profiler count: queries not above the threshold. Changes under green 03.01."},{"title":"Indexes from actual slow queries","pf":1.5,"mf":0.5,"result":"migrations/SQL","desc":"Indexes only from the slow log, not “on every FK”. Migration/SQL with a rollback."},{"title":"Admin reports without hydrating every entity","pf":2.5,"mf":1.0,"result":"query changes","desc":"Lists/reports: scalar/DTO, not findAll Product. Otherwise the administration exhausts PHP memory."}]},{"id":"07.03","title":"Redis cache","pkg":"II","why":"Doctrine cache via Redis in config.yml is commented out.","done":"Cache where it is safe (not cart/account). Test: cache does not leak between users.","deps":"07.01, 03.02","role":"Senior","pfH":6.5,"mfH":2.5,"subtasks":[{"title":"HTTP cache only on anonymous pages","pf":1.5,"mf":0.5,"result":"do not cache the cart","desc":"Cache the anonymous catalogue, not the cart and not the account. Otherwise personal data will leak between users."},{"title":"Redis metadata/query cache + product invalidation","pf":2.5,"mf":1.0,"result":"config + code","desc":"Enable Doctrine cache in Redis (currently commented out) and flush it when a product is saved in the administration."},{"title":"Forbid cache on personal pages","pf":1.0,"mf":0.5,"result":"review","desc":"Review: /cart, /account, checkout, admin — no-store. Test 07.03.4 will confirm this."},{"title":"Test: no cache leak between users","pf":1.5,"mf":0.5,"result":"functional","desc":"Functional: user A must not see B’s cart/name after the cache is warmed. Blocker for enabling HTTP cache."}]},{"id":"07.04","title":"Images and assets","pkg":"II","why":"Assetic is not to be developed; replacement is in stage 08. A webp package already exists.","done":"LiipImagine presets, do not regenerate all webp at once, search must not block first paint.","deps":"07.01","role":"Middle+","pfH":5.5,"mfH":2.0,"subtasks":[{"title":"LiipImagine presets, deferred generation","pf":1.5,"mf":0.5,"result":"config","desc":"Do not generate presets synchronously for the entire gallery in the product-page request. Deferred/on-demand generation."},{"title":"webp selectively, not everything at once","pf":1.5,"mf":0.5,"result":"plan","desc":"The webp package already exists. Enable it on top templates; do not regenerate the entire media library overnight."},{"title":"Note: Assetic → Encore in wave H","pf":1.0,"mf":0.5,"result":"ticket 08","desc":"Do not develop Assetic. Ticket reference to 08.03/08.06. In 07 only do not make it worse."},{"title":"Search JS must not block first paint","pf":1.5,"mf":0.5,"result":"asset change","desc":"The search script must not sit on the first-paint critical path: defer/later. Product page/listings must not wait for Typesense."}]},{"id":"07.05","title":"Search and external HTTP","pkg":"II","why":"A Typesense outage must not take down the storefront.","done":"Timeouts, degradation, GeoIP/recaptcha not on the render critical path.","deps":"03.01, 07.01","role":"Middle+","pfH":3.5,"mfH":1.5,"subtasks":[{"title":"Typesense/Algolia: timeout and degradation","pf":1.5,"mf":0.5,"result":"storefront stays up","desc":"Short timeout; when down — the page without search, not 500. The storefront matters more than the suggest."},{"title":"GeoIP, recaptcha, Mailchimp not on the critical path","pf":1.0,"mf":0.5,"result":"review","desc":"Do not block storefront HTML on external GeoIP/recaptcha/Mailchimp. Timeout or deferred call."},{"title":"Synchronous cron HTTP not on the storefront","pf":1.0,"mf":0.5,"result":"controller review","desc":"curl to the neighbouring storefront and SOAP — only in cron/administration, not in the product-page GET. Controller review."}]},{"id":"07.06","title":"Front-end quick wins","pkg":"II","why":"A redesign is out of scope. Only surplus weight.","done":"Inspinia plugins only where needed. Check of mobile Twig.","deps":"07.01","role":"Middle (frontend)","pfH":4.0,"mfH":1.5,"subtasks":[{"title":"Heavy plugins only on the admin pages that need them","pf":1.5,"mf":0.5,"result":"template changes","desc":"Do not load jVectorMap, jeditable and similar on every admin page. Include them selectively."},{"title":"Surplus fonts/sliders on interior pages","pf":1.0,"mf":0.5,"result":"changes","desc":"Do not pull the home-page slider and surplus fonts onto checkout/account."},{"title":"Check of mobile templates","pf":1.5,"mf":0.5,"result":"page sample","desc":"After the changes — a sample of mobile Twig (product, cart). Separate templates drift easily."}]},{"id":"07.07","title":"Before/after measurement","pkg":"II","why":"Close the stage with figures, not impressions.","done":"The same 10 URLs, before/after table. What is deferred until PHP 8 / SF7.","deps":"07.02–07.06","role":"Lead","pfH":2.5,"mfH":1.0,"subtasks":[{"title":"Repeat measurement of the same 10 URLs","pf":1.5,"mf":0.5,"result":"table","desc":"The same URLs and method as in 07.01. Before/after table in the client report."},{"title":"List of items deferred until Symfony 7","pf":1.0,"mf":0.5,"result":"backlog","desc":"What was not done: JIT, http-client, Encore. So that “we did not have time” is not mixed with “not required”."}]}]},{"id":"08","title":"Symfony 3.4 → 7.4 LTS","goal":"PHP 8.3 + Symfony 7.4. One major = one branch = soak on dev = production.","pfD":45.5,"mfD":17.0,"color":"blue","tasks":[{"id":"08.01","title":"Preparation: PHP 8.1 still on Symfony 3.4","pkg":"III","why":"Remove incompatibilities before changing the framework. Extensions: grpc, imagick, redis.","done":"Docker PHP 8.1 alongside 7.4. DoctrineMigrations + schema baseline. Tests green on 8.1. Infrastructure agrees to 8.1 on dev.","deps":"Packages I–II, especially 03 C3","role":"Senior + infrastructure","pfH":51.5,"mfH":20.5,"subtasks":[{"title":"Inventory of each(), dynamic properties, string/int","pf":7.5,"mf":3.0,"result":"list of fixes","desc":"Find PHP 8.1 incompatibilities in our code before changing Symfony. List of fixes; the fixes themselves are in this same stage 08.01."},{"title":"Doctrine 2.x patches for 8.1","pf":5.5,"mf":2.0,"result":"composer","desc":"Raise Doctrine ORM/DBAL within 2.x, compatible with 8.1 and still with SF 3.4. Do not jump to ORM 3."},{"title":"Docker PHP 8.1 in parallel with 7.4","pf":5.5,"mf":2.0,"result":"not production","desc":"A second PHP 8.1 image/service for verification. Production remains 7.4 until 08.02 is passed."},{"title":"DoctrineMigrationsBundle, schema baseline","pf":7.5,"mf":3.0,"result":"first migration","desc":"Introduce migrations for the first time: baseline of the current schema, without recreating production. Thereafter all schema changes are migrations."},{"title":"Repair tests on 8.1","pf":7.5,"mf":3.0,"result":"green suite","desc":"Run the suite on 8.1, repair test and code failures. A green suite is the criterion that 4.4 can be planned."},{"title":"Agree PHP 8.1 on the development host","pf":3.0,"mf":1.0,"result":"infrastructure","desc":"Oxygen/cluster infrastructure: 8.1 on dev alongside 7.4. Without this the upgrade lives only in the developer’s Docker."},{"title":"Reserve for extension surprises (grpc, imagick, redis)","pf":15.0,"mf":6.5,"result":"inside this task, not a separate ticket","desc":"Not a separate ticket: time inside 08.01 for grpc (Google Ads), imagick, redis.so under 8.1. If an extension is missing — an infrastructure blocker."}]},{"id":"08.02","title":"Symfony 3.4 → 4.4","pkg":"III","why":"The first major. Flex is not enabled; the app/src structure remains.","done":"Application on 4.4 on dev, soak, then production. Suite + manual payment checklist.","deps":"08.01","role":"Senior","pfH":48.5,"mfH":16.5,"subtasks":[{"title":"Rector SYMFONY_40…44 + manual leftovers","pf":14.0,"mf":5.5,"result":"branch upgrade/sf44","desc":"Run Rector with Symfony 4.0–4.4 sets, then finish manually what it does not touch: custom Payum gateways, bundles without upstream, our helpers."},{"title":"templating → Twig only","pf":5.5,"mf":2.0,"result":"config.yml without framework.templating","desc":"In Symfony 3, config.yml has framework.templating (PHP+Twig engine). In 4.4 this component is removed from FrameworkBundle — only TwigBundle remains. Delete the templating key, verify that all templates are .html.twig, that there are no php-templates, and that controller render (@Template / render) does not fail."},{"title":"Autowiring gradually, do not break YAML","pf":6.5,"mf":2.0,"result":"services stay alive","desc":"Enable autowire/autoconfigure for new code; do not rewrite existing services.yml in bulk. If a service breaks after the upgrade — add an alias/bind pointwise, not “a move to pure DI in one sprint”."},{"title":"Security: anonymous, logout, csrf","pf":6.5,"mf":2.0,"result":"login / logout / CSRF work","desc":"In 4.4 security.yaml changes: anonymous, logout, csrf_token_generator. Exercise FOSUser/form login, logout, administration. Do not break access_control by ROLE_*."},{"title":"Remove SensioDistribution generator","pf":3.0,"mf":1.0,"result":"dev dependencies without DistributionBundle","desc":"SensioDistributionBundle and the generator are not needed in Symfony 4. Remove them from AppKernel (dev) and composer require-dev; leave a working cache:clear / composer scripts without the Distribution ScriptHandler."},{"title":"Suite + manual checklist","pf":6.5,"mf":2.0,"result":"green CI + manual payment on dev","desc":"Full PHPUnit and Playwright smoke. Manual checklist: home, product, cart, login, admin, sandbox payment."},{"title":"Soak on dev, then production","pf":6.5,"mf":2.0,"result":"4.4 release to production","desc":"Branch onto develop, 5–10 working days on the development server, error monitoring, then master. No business features in this PR."}]},{"id":"08.03","title":"Symfony 4.4 → 5.4: Mailer and FOSUser","pkg":"III","why":"The heaviest domain step. FOSUserBundle 2.0 is unmaintained.","done":"Swiftmailer replaced. Own security over the current users table. Assetic disabled. Soak → production.","deps":"08.02, 03.04","role":"Senior","pfH":83.5,"mfH":31.5,"subtasks":[{"title":"Swiftmailer → Mailer, all MailBundle emails","pf":16.0,"mf":6.5,"result":"emails on dev","desc":"Replace SwiftmailerBundle with Symfony Mailer. Collect all order/registration/reset emails and run them on dev with interception."},{"title":"FOSUser replacement: Security + User entity","pf":24.5,"mf":9.5,"result":"login/registration/reset","desc":"FOSUser 2.0 is unmaintained. Own firewall/authentication over the current users table: login, registration, reset, roles. Not a new IAM and not a change of user ids."},{"title":"ParamConverter → controller arguments","pf":8.5,"mf":3.0,"result":"Rector + manual","desc":"SensioFrameworkExtra ParamConverter leaves in 5.4. Rector + manual replacement with controller arguments. The suite must not go red on admin routes."},{"title":"Disable Assetic, serve static files directly","pf":8.5,"mf":3.0,"result":"assets in place","desc":"Assetic is unmaintained. Serve CSS/JS directly or with a minimal Encore. Storefront and administration without broken styles."},{"title":"JMS Serializer / FOSRest update or narrow","pf":6.5,"mf":2.0,"result":"API stays alive","desc":"Update or narrow the API layer to what is actually used. Do not carry dead REST endpoints into 5.4."},{"title":"Rector SF5 + suite","pf":11.0,"mf":4.5,"result":"green","desc":"Rector Symfony 5 sets, then the full suite and a manual checklist of login/emails."},{"title":"Soak dev → production","pf":8.5,"mf":3.0,"result":"release","desc":"5–10 working days on dev after 5.4, then production. The FOSUser replacement is a window outside peak season."}]},{"id":"08.04","title":"Symfony 5.4 → 6.4","pkg":"III","why":"PHP ≥ 8.2, annotations → attributes, Security 6.","done":"PHP 8.2 on dev/prod. Attributes. Authenticator manager. Soak.","deps":"08.03","role":"Senior","pfH":50.0,"mfH":17.5,"subtasks":[{"title":"PHP 8.2 on dev/prod","pf":5.5,"mf":2.0,"result":"infrastructure","desc":"Raise PHP 8.2 (a 6.4 requirement). First dev, suite, then production in step with the 6.4 deployment."},{"title":"Annotations → attributes (Rector)","pf":11.0,"mf":4.5,"result":"code","desc":"Route/ORM/Security annotations → PHP 8 attributes. Rector + pointwise manual files. Without this 6.4 will not start."},{"title":"security.yaml authenticator manager","pf":8.5,"mf":3.0,"result":"login","desc":"Security 6: authenticator manager instead of the old listeners. Exercise login, remember, access_denied, all ROLE_*."},{"title":"Typed pro
